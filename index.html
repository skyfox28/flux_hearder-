    --in:#5d8dca; --out:#cc6c42; --silo:#8c85cf; --pick:#26a083; --c4:#b58c2c; --c5:#c9698f; --c6:#4c9453;
    --good:#4fae59; --warn:#d0a042; --crit:#d06060; --good-ink:#7cc884; --warn-ink:#dcb55e; --crit-ink:#e88a8a;
    --chip:rgba(255,255,255,.08); --chip-on:#f3f5fa; --chip-on-ink:#0e1422;
    --input:rgba(10,14,26,.55);

  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --bg-1:#151922; --bg-2:#181820; --bg-3:#141b1c;
    --blob-1:#2a3f5e; --blob-2:#4d3a30; --blob-3:#264740; --blob-4:#353257;
    --glass: rgba(30,34,46,.62);
    --glass-strong: rgba(36,41,55,.82);
    --glass-soft: rgba(255,255,255,.05);
    --glass-border: rgba(255,255,255,.14);
    --glass-edge: rgba(0,0,0,.3);
    --glass-shine: rgba(255,255,255,.22);
    --shadow: 0 12px 44px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.4);
    --text-1:#e7eaf1; --text-2:#b3b9c8; --text-3:#8a91a3;
    --grid:#2e3446; --axis:#4a5266;
    --accent:#5d8dca;
    --in:#5d8dca; --out:#cc6c42; --silo:#8c85cf; --pick:#26a083; --c4:#b58c2c; --c5:#c9698f; --c6:#4c9453;
    --good:#4fae59; --warn:#d0a042; --crit:#d06060; --good-ink:#7cc884; --warn-ink:#dcb55e; --crit-ink:#e88a8a;
    --chip:rgba(255,255,255,.08); --chip-on:#f3f5fa; --chip-on-ink:#0e1422;
    --input:rgba(10,14,26,.55);
    --row-hover:rgba(93,141,202,.12);
    --row-alt:rgba(255,255,255,.025);
}
*{box-sizing:border-box}
svg[aria-hidden="true"]{width:18px;height:18px;flex:none}
html,body{margin:0;min-height:100%}
html{background:var(--bg-1)}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; color:var(--text-1);
  background:linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32}
.blobs i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--blob-1)}
.blobs i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:8vh;background:var(--blob-2);opacity:.45}
.blobs i:nth-child(3){width:42vw;height:42vw;left:25vw;bottom:-18vw;background:var(--blob-3);opacity:.45}
.blobs i:nth-child(4){width:26vw;height:26vw;right:18vw;bottom:10vh;background:var(--blob-4);opacity:.4}

.glass{
  position:relative;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(120%);
  backdrop-filter:blur(22px) saturate(120%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-shine), inset 0 -1px 0 var(--glass-edge);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%);
  opacity:.4;
}
:root[data-theme="dark"] .glass::before{opacity:.12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glass::before{opacity:.12}}

.app{position:relative;z-index:1;display:grid;grid-template-columns:232px 1fr;gap:18px;padding:18px;min-height:100vh}
aside.nav{position:sticky;top:18px;align-self:start;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}

main{min-width:0;display:flex;flex-direction:column;gap:18px}

.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.navb{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;color:#fff}

header.top .sub{color:var(--text-3);font-size:13px}
.spacer{flex:1}
.weekpick{display:flex;align-items:center;gap:6px;background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:999px;padding:4px}

.iconbtn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--text-2)}

.iconbtn svg{width:18px;height:18px}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;
  background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--text-1);box-shadow:inset 0 1px 0 var(--glass-shine),0 2px 6px rgba(0,0,0,.06)}
.btn:hover{filter:brightness(1.04)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.card{padding:18px 20px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:650}

.grid{display:grid;gap:18px}

.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}

.chip{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--chip);border:1px solid color-mix(in srgb,var(--text-3) 30%,transparent);color:var(--text-2)}

input.search:focus,select.inp:focus,input.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}

.tbl-wrap{overflow:auto;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass-soft);max-height:70vh}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}

.xlcharts > div{padding:12px 14px;border-radius:18px;background:var(--glass-soft);border:1px solid var(--glass-border)}
.clickcard{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.clickcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--glass-border))}
.clickcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clickcard .expand{position:absolute;top:16px;right:18px;font-size:12px;font-weight:600;color:var(--accent);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.daycard{padding:12px 14px;border-radius:16px;background:var(--glass-soft);border:1px solid var(--glass-border)}
.dch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dcs{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:8px 0 2px}
.dcs.in{color:var(--in)} .dcs.out{color:var(--out)}
.daycard ul{list-style:none;margin:0;padding:0}
.daycard li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--grid) 60%,transparent);font-size:12.5px}
.daycard li small{grid-column:1/-1;color:var(--text-3);font-size:11px}
i.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.linkbtn:hover{text-decoration:underline}
.nav .foot .linkbtn{display:inline;padding:0;border-radius:0;color:var(--accent);font-weight:600}
.nav .foot .linkbtn:hover{background:none}
.appfoot{text-align:center;color:var(--text-3);font-size:12px;padding:4px 0 10px}
.reel-line{display:grid;grid-template-columns:60px 1fr;gap:0 8px;align-items:baseline;margin-top:6px}
.reel-line span{font-size:12px;color:var(--text-3)}
.reel-line b{font-size:15px}
.reel-line b.ok{color:var(--good-ink)} .reel-line b.ko{color:var(--crit-ink)}
.reel-line small{grid-column:2;font-size:11.5px;color:var(--text-3)}
.reel-line small strong.late{color:var(--crit-ink);font-weight:700}
.plan{display:flex;flex-direction:column;gap:16px}
.timeline{margin:4px 0 12px;padding:8px 10px 4px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--glass-border)}
.timeline svg{display:block;width:100%;height:auto;overflow:visible}
.plan-day{padding:14px;border-radius:18px;background:var(--glass-soft);border:1px solid var(--glass-border);border-left:5px solid var(--good)}
.plan-day.late{border-left-color:var(--crit)}
.plan-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.plan-head h3{margin:0 0 2px;font-size:18px}
.plan-prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
.plan-prog .bar{width:180px;margin:0}
.pvs{display:flex;gap:8px;flex-wrap:wrap}
.pv{display:flex;flex-direction:column;padding:8px 12px;border-radius:14px;min-width:120px;border:1px solid var(--glass-border);background:var(--glass-strong)}
.pv span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.pv b{font-size:15px} .pv small{font-size:11.5px;color:var(--text-3)}
.pv.ok b{color:var(--good-ink)} .pv.ko b{color:var(--crit-ink)}
.pv.ko{background:color-mix(in srgb,var(--crit) 8%,var(--glass-strong))}
.t tr.row-late td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.caret{display:inline-block;width:12px;color:var(--text-3)}
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px}
.mback{position:absolute;inset:0;background:rgba(10,15,30,.4);-webkit-backdrop-filter:blur(6px) saturate(120%);backdrop-filter:blur(6px) saturate(120%);animation:fadeIn .15s ease}
.mpanel{position:relative;width:min(1180px,100%);max-height:92vh;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg-1) 90%,transparent);animation:popIn .18s ease}
.mhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--glass-border)}
.mhead h2{margin:0;font-size:18px}
.mbody{overflow:auto;padding:16px 20px 22px}
.mbody .tbl-wrap{max-height:none;margin-bottom:6px}
h3.mh{font-size:14px;margin:18px 0 6px;font-weight:650}
h3.mh + .hint{margin-top:-2px}
body.modal-open{overflow:hidden}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
@media (prefers-reduced-motion: reduce){.mback,.mpanel{animation:none}.kpi[data-detail]{transition:none}}
@media (max-width: 1100px){ .g3{grid-template-columns:1fr 1fr} }
@media (max-width: 900px){
  .app{grid-template-columns:1fr;padding:12px 16px;gap:14px}
  aside.nav{position:sticky;top:8px;z-index:20;flex-direction:row;overflow-x:auto;padding:8px;gap:2px}
  .brand,.nav .sep,.nav .foot{display:none}
  .nav button{white-space:nowrap;padding:8px 10px}
  .g2,.g3{grid-template-columns:1fr}
  .weekpick b{min-width:110px}
  input.search{min-width:0;width:100%}
}
@media print{ .blobs,aside.nav,.noprint{display:none!important} .app{display:block} .glass{backdrop-filter:none;box-shadow:none;background:#fff} }

/* ============================================================
   STYLE SOBRE (industriel) : surfaces opaques, contrastes renforcés, textes plus grands
   activé par la classe html.style-sobre (Paramètres › À propos › Style)
   ============================================================ */
html.style-sobre{
  --bg-1:#eceef1; --bg-2:#eceef1; --bg-3:#eceef1;
  --glass:#ffffff; --glass-strong:#ffffff; --glass-soft:#f7f8fa; --glass-border:#d3d8de; --glass-edge:transparent; --glass-shine:transparent;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  --text-1:#121822; --text-2:#333c4b; --text-3:#525b6a;
  --grid:#e2e5ea; --axis:#8f97a3;
  --accent:#1d5ea8; --in:#1d5ea8; --out:#c45a26; --silo:#5b4fb0; --pick:#1d8a6c;
  --good:#2e8b45; --good-ink:#1f6a33; --warn:#c98a12; --warn-ink:#7a4f00; --crit:#c23b33; --crit-ink:#a12a24;
  --chip:#f1f3f6; --chip-on:#121822; --chip-on-ink:#fff; --input:#ffffff;
  --row-hover:#eaf1fa; --row-alt:#f7f8fa; --th-bg:#f1f3f6; --radius:8px;
}
@media (prefers-color-scheme: dark){
  html.style-sobre:not([data-theme="light"]){
    --bg-1:#15181d; --bg-2:#15181d; --bg-3:#15181d;
    --glass:#1e232a; --glass-strong:#252b33; --glass-soft:#1a1f25; --glass-border:#353d48;
    --shadow:none; --text-1:#eceff3; --text-2:#c5ccd6; --text-3:#a2abb7; --grid:#2c333d; --axis:#5c6673;
    --accent:#6fa3e6; --in:#6fa3e6; --good-ink:#7fd08f; --warn-ink:#f0c060; --crit-ink:#f3948d;
    --chip:#252b33; --chip-on:#eceff3; --chip-on-ink:#121822; --input:#15181d; --row-hover:#26303c; --row-alt:#1b2026; --th-bg:#252b33;
  }
}
html.style-sobre[data-theme="dark"]{
  --bg-1:#15181d; --bg-2:#15181d; --bg-3:#15181d;
  --glass:#1e232a; --glass-strong:#252b33; --glass-soft:#1a1f25; --glass-border:#353d48;
  --shadow:none; --text-1:#eceff3; --text-2:#c5ccd6; --text-3:#a2abb7; --grid:#2c333d; --axis:#5c6673;
  --accent:#6fa3e6; --in:#6fa3e6; --good-ink:#7fd08f; --warn-ink:#f0c060; --crit-ink:#f3948d;
  --chip:#252b33; --chip-on:#eceff3; --chip-on-ink:#121822; --input:#15181d; --row-hover:#26303c; --row-alt:#1b2026; --th-bg:#252b33;
}
html.style-sobre body{background:var(--bg-1);font-size:15px}

.data-chip.old{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 60%,var(--glass-border))}

/* badges : un symbole en plus de la couleur */
html.style-sobre .badge{font-size:13px;border-radius:4px;padding:3px 9px}
html.style-sobre .badge::before{width:auto;height:auto;background:none;border-radius:0;font-weight:800;content:"•"}
html.style-sobre .b-good::before{content:"✓"} html.style-sobre .b-warn::before{content:"!"} html.style-sobre .b-crit::before{content:"✗"} html.style-sobre .b-info::before{content:"i"}
html.style-sobre .b-nodot::before{display:none}
/* tableaux */
html.style-sobre .tbl-wrap{border-radius:6px;background:var(--glass)}

<script>
/* Écran d'ouverture : petite scène 3D en CSS (entrepôt, quais, camions, chariot, palettes) + étapes réelles du démarrage */
const SPLASH = (() => {
  const el = document.getElementById('splash');
  try { const th = localStorage.getItem('flux-theme'); if (th) document.documentElement.dataset.theme = th; if (localStorage.getItem('flux-style') === 'sobre') document.documentElement.classList.add('style-sobre'); const dn = localStorage.getItem('flux-density'); if (dn === 'compact' || dn === 'airy') document.documentElement.classList.add('dens-' + dn); } catch (e) {}
  let still = false; try { still = localStorage.getItem('flux-splash') === 'off'; } catch (e) {}
  const off = !/[?#&]splash\b/.test(location.href) && navigator.webdriver;   // tests automatisés : pas d'écran d'ouverture
  if (still) el.classList.add('still');
  const noop = { step() {}, ask() { return Promise.resolve(null); }, finish() {}, ver() {}, on: false, user: () => 'test' };
  if (off) { el.remove(); return noop; }
  const W = document.getElementById('spWorld');
  const B = (par, x, y, z, w, d, h, cls, st = '') => {
    const e = document.createElement('div'); e.className = 'b3 ' + cls;
    e.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${d}px;transform:translateZ(${z}px);${st}`;
    e.innerHTML = `<i class="t" style="transform:translateZ(${h}px)"></i><i class="f" style="top:${d - h}px;height:${h}px;transform:rotateX(-90deg)"></i><i class="k" style="height:${h}px"></i><i class="l" style="width:${h}px"></i><i class="r" style="left:${w - h}px;width:${h}px"></i>`;
    par.appendChild(e); return e;
  };
  const G = (par, x, y, cls = '', st = '') => { const g = document.createElement('div'); g.className = 'sp-grp ' + cls; g.style.cssText = `left:${x}px;top:${y}px;${st}`; par.appendChild(g); return g; };
  const div = (par, cls) => { const d = document.createElement('div'); d.className = cls; par.appendChild(d); return d; };
  const COL = ['var(--in)', 'var(--silo)', 'var(--pick)', 'var(--c4)', 'var(--out)'];
  const pallet = (par, x, y, z, c, pop, delay) => { const g = G(par, x, y, pop ? 'sp-pop' : '', `transform:translateZ(${z}px);width:22px;height:22px;${delay != null ? `animation-delay:${delay}s` : ''}`); B(g, 0, 0, 0, 22, 22, 4, 'sp-pal'); B(g, 1, 1, 4, 20, 20, 16, 'sp-load', `--c:${c}`); return g; };
  const truck = (par, x, y, cls) => {
    const g = G(par, x, y, cls, 'width:40px;height:150px');
    const sh = div(g, 'sp-shd'); sh.style.transform = 'translateZ(.5px)';
    B(g, 0, 0, 10, 40, 112, 50, 'sp-trl');
    B(g, 3, 116, 7, 34, 30, 40, 'sp-cab');
    B(g, 2, 110, 7, 36, 8, 12, 'sp-whl');
    for (const [wy, wx] of [[8, -2], [26, -2], [8, 38], [26, 38], [122, -2], [122, 38]]) B(g, wx, wy, 0, 4, 14, 12, 'sp-whl');
    return g;
  };
  // sol, parking, route, aire de quai
  div(W, 'sp-ground'); div(W, 'sp-lot'); div(W, 'sp-road'); div(W, 'sp-apron');
  // entrepôt + portes de quai + enseigne
  const wh = B(W, 60, 40, 0, 520, 160, 118, 'sp-wh');
  const fr = wh.querySelector('.f'); [0, 1, 2, 3, 4].forEach(i => { const d = div(fr, 'sp-door' + (i <= 1 || i === 3 ? ' open' : '')); d.style.left = (46 + i * 90) + 'px'; });
  const sg = div(fr, 'sp-sign'); sg.innerHTML = 'MONTEUX<b>3</b>';
  B(W, 120, 70, 118, 40, 30, 16, 'sp-hvac'); B(W, 470, 120, 118, 50, 34, 14, 'sp-hvac');
  // camions à quai (manœuvre en marche arrière, puis départ) et sur la route
  truck(W, 205, 205, 'sp-dockA'); truck(W, 385, 205, 'sp-dockB');
  truck(W, 0, 340, 'sp-roadT'); truck(W, 0, 372, 'sp-roadT2');
  // chariot élévateur qui fait la navette entre le stock et le quai
  const fk = G(W, 145, 232, 'sp-fkA', 'width:20px;height:22px');
  const fs = div(fk, 'sp-shd'); fs.style.transform = 'translateZ(.5px)';
  B(fk, 0, 2, 0, 20, 20, 16, 'sp-fk'); B(fk, 2, -1, 0, 16, 3, 32, 'sp-mast'); B(fk, 4, 12, 16, 12, 8, 10, 'sp-mast');
  const cr = G(fk, -1, -24, 'sp-carry', 'width:22px;height:22px'); B(cr, 0, 0, 3, 22, 22, 4, 'sp-pal'); B(cr, 1, 1, 7, 20, 20, 16, 'sp-load', '--c:var(--pick)');
  // palettes préparées au quai (apparaissent l'une après l'autre) et stock
  [[470, 250], [496, 250], [522, 250], [470, 276], [496, 276], [522, 276]].forEach(([x, y], i) => pallet(W, x, y, 0, COL[i % COL.length], true, i * .45));
  [[70, 225], [96, 225], [70, 225, 20], [96, 225, 20], [70, 251], [96, 251]].forEach(([x, y, z], i) => pallet(W, x, y, z || 0, COL[(i + 2) % COL.length]));
  // panneau « COMING SOON » au bord du parking
  { const bb = G(W, 650, 290, '', 'width:150px;height:6px'); B(bb, 20, 0, 0, 5, 5, 34, 'sp-mast'); B(bb, 125, 0, 0, 5, 5, 34, 'sp-mast');
    const pn = div(bb, 'sp-billboard'); pn.style.transform = 'translateZ(30px) translateY(-41px) rotateX(-90deg)'; pn.innerHTML = '<div>COMING SOON<small>EN DÉVELOPPEMENT</small></div>'; }
  // arbres
  for (const [x, y] of [[-40, 60], [-30, 150], [650, 40], [660, 150], [-60, 280]]) { B(W, x + 8, y + 8, 0, 6, 6, 14, 'sp-trunk'); B(W, x, y, 14, 22, 22, 26, 'sp-tree'); }
  // échelle (téléphone)
  const fit = () => { const st = el.querySelector('.sp-stage'); const k = Math.min(1, st.clientWidth / 900, st.clientHeight / 500) * .92; document.getElementById('spCam').style.scale = k; };
  fit(); addEventListener('resize', fit);
  // étapes
  const STEPS = [['db', 'Données locales'], ['calc', 'Calcul des flux de la semaine'], ['sync', 'Sauvegarde partagée']];
  const ol = document.getElementById('spSteps');
  ol.innerHTML = STEPS.map(([k, l]) => `<li data-k="${k}"><i></i><span>${l}</span><small></small></li>`).join('');
  // Connexion de test (temporaire, à supprimer) : identifiant admin. Contrôle côté navigateur uniquement, ce n'est pas une sécurité.
  const hash = t => { let h = 2166136261; for (const c of t) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
  const ACCOUNTS = { admin: hash('jay') };
  let closed = false, waiter = null, ready = false, user = null;
  const go = document.getElementById('spGo'), form = document.getElementById('spLogin');
  const close = () => { if (closed) return; closed = true; if (waiter) waiter(null); el.classList.add('out'); setTimeout(() => el.remove(), 650); try { sessionStorage.setItem('flux-user', user); } catch (e) {} if (window.onSplashLogin) window.onSplashLogin(user); };
  const tryClose = () => { if (user && ready && !waiter) close(); else if (user) { go.disabled = true; go.textContent = waiter ? 'Répondez ci-dessus' : 'Chargement…'; } };
  form.onsubmit = e => {
    e.preventDefault();
    const u = document.getElementById('spUser').value.trim().toLowerCase(), pw = document.getElementById('spPass').value;
    if (ACCOUNTS[u] && ACCOUNTS[u] === hash(pw)) { user = u; document.getElementById('spErr').textContent = ''; tryClose(); }
    else { document.getElementById('spErr').textContent = 'Identifiant ou mot de passe incorrect.'; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); document.getElementById('spPass').select(); }
  };
  setTimeout(() => document.getElementById('spUser').focus(), 300);
  return {
    on: true,
    ver(v) { document.getElementById('spVer').textContent = v; },
    step(k, state, det) {
      const li = ol.querySelector(`[data-k="${k}"]`); if (!li) return;
      li.className = state; li.querySelector('i').textContent = state === 'done' ? '✓' : state === 'warn' ? '!' : state === 'skip' ? '–' : '';
      li.querySelector('small').textContent = det || '';
      const n = ol.querySelectorAll('li.done,li.warn,li.skip').length; document.getElementById('spBar').style.width = Math.round(n / STEPS.length * 100) + '%';
    },
    // question avec boutons (ex. reconnecter le dossier : il faut un clic de l'utilisateur)
    ask(btns) {
      if (closed) return Promise.resolve(null);
      const act = document.getElementById('spAct');
      return new Promise(res => {
        waiter = v => { waiter = null; act.innerHTML = ''; res(v); if (user) { go.disabled = false; go.textContent = 'Entrer ›'; tryClose(); } };
        act.innerHTML = btns.map(([v, l, primary]) => `<button class="btn sm${primary ? ' primary' : ''}" data-spv="${v}">${l}</button>`).join('');
        act.querySelectorAll('button').forEach(b => b.onclick = () => waiter && waiter(b.dataset.spv));
        act.querySelector('.primary')?.focus();
      });
    },
    finish() { ready = true; tryClose(); },
    user: () => user,
  };
})();
</script>

  ['1.35.0', '08/10/2026', 'Statut par poste : un poste est fait dès qu’il est validé (Validat. prélèvement = C) ou que son activité WM est terminée, même si la livraison est encore en B (le statut global de prélèvement est celui de la livraison entière) ; « commencé » = activité WM partielle. Apprentissage : intervalles de plus de 14 h entre deux imports ignorés, postes apparus et terminés entre deux imports comptés.'],

  ['1.33.0', '01/10/2026', 'Détails dédiés « Entrées » et « Sorties » (semaine ou jour) : capacité quai, graphique par jour face à la capacité ou heure par heure, répartition par origine / transporteur, jour le plus chargé, listes détaillées ; ouverts depuis les jauges et les tuiles.'],
  ['1.32.0', '01/10/2026', 'Détails dédiés « Picking » et « Sortie SILO » (jour par jour) : courbe du reste à faire heure par heure avec les échéances, créneaux, livraisons dans l’ordre de préparation / file du cariste, cadence apprise et certitude, besoin en préparateurs ; jauges, tuiles et anneaux ouvrent leur propre détail (transporteur, circuit, livraisons). Tableau de bord épuré : « À traiter » en haut, simulateur, indicateurs détaillés et semaine jour par jour repliables.'],

  ['1.30.2', '01/10/2026', 'Paramètres : cariste entrée SILO et cariste sortie SILO réglés par une case « Poste ouvert (1 cariste) » au lieu d’un nombre (magasin automatique, jamais plus d’un cariste par poste).'],
  ['1.30.1', '01/10/2026', 'Simulateur « Et si ? » : côté SILO, seule la cadence se règle (magasin automatique, 1 cariste par poste en entrée et en sortie).'],
  ['1.30.0', '01/10/2026', 'Pilotage visuel : jauges (quais, picking, sortie SILO, entrées, sorties) et anneaux (avancement des livraisons, picking par circuit, sorties par transporteur) sur le tableau de bord et dans la vue jour ; simulateur « Et si ? » (préparateurs, caristes sortie SILO, cadences) avec détail par créneau dans la vue jour ; verre plus transparent mais plus lisible (textes plus grands, détail des tuiles en entier).'],
  ['1.29.0', '01/10/2026', 'Style « sobre » (industriel), au choix dans Paramètres › À propos : surfaces opaques sans flou, textes plus grands et plus contrastés, détail des tuiles visible en entier, badges avec symbole (✓ ! ✗), barre du haut sur une ligne (pastille d’état des données, bouton Mettre à jour ; Purger reste dans Paramètres).'],
  ['1.28.3', '01/10/2026', 'VL06O : chemin SharePoint prévu (Flux_hebdo\\VL06O), réglable dans Paramètres, rappelé dans l’onglet Sources et vérifié quand on relie le dossier.'],
  ['1.28.2', '01/10/2026', 'Paramètres : « Caristes SILO » avec le cariste entrée SILO (rangement des réceptions) et le cariste sortie SILO (palettes complètes des commandes), à la place des équipes de rangement ; les sorties se comptent en livraisons, pas en camions (une livraison n’est pas un camion).'],

  ['1.24.0', '01/10/2026', 'Navettes usines (copier-coller VL06I, sites 2560 et 2510, palettes = colis, date dépassée = jour de la VL06I) dans les entrées et le quai de réception ; overlay flux sans solde ni retours interco ; affichage épuré (explications repliées derrière ⓘ, alertes sur une ligne).'],

    fr.onerror = () => rej(fr.error);

  });
}
const sheetRows = ws => ws ? XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false }) : [];
function headerMap(header, spec) {
  const H = header.map(norm); const map = {};
  for (const [key, cands] of Object.entries(spec)) {
    for (const c of cands) { const i = H.indexOf(norm(c)); if (i >= 0) { map[key] = i; break; } }
    if (map[key] == null) for (const c of cands) { const n = norm(c); const i = H.findIndex(h => h && h.startsWith(n)); if (i >= 0) { map[key] = i; break; } }
  }
  return map;
}

// Deux mises en forme acceptées : l'export complet (affret, Prep, Code Depot, Liv, Date enlevement,

const AF_SPEC = {
  date: ['Date enlevement', 'Date enlèvement', 'Date Enl', 'Date'], liv: ['Livraison', 'Liv'], client: ['CodeClient', 'Client'], prep: ['Prep'],
  affret: ['affret'], depot: ['Code Depot', 'Dépôt'], transp: ['code transporteur', 'Transp', 'Code transp'], transpNom: ['Nom transporteur', 'Nom_Transp'],

  comm: ['commentaires', 'commentaire'],

// ordre des colonnes quand le collage n'a pas d'en-tête
const AF_ORDER_NEW = { affret: 0, prep: 1, depot: 2, liv: 3, date: 4, transp: 5, transpNom: 6, client: 7, nom: 8, ville: 9, rue: 10, rue4: 11, cp: 12, palEnt: 13, couches: 14, cartDet: 15, cartPk: 16, poidsTax: 17, poids: 18, blocs: 19, pal: 20, comm: 21 };
const AF_ORDER_OLD = { date: 0, liv: 1, client: 2, prep: 3, transp: 4, nom: 5, ville: 6, cp: 7, poids: 8, poidsTax: 9, blocs: 10, pal: 11, palEnt: 12, couches: 13, cartDet: 14, cartPk: 15, comm: 16 };
const accessBool = v => /^(-1|1|oui|vrai|true|x)$/i.test(str(v));
function parseAffret(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) throw new Error('Rien à importer.');
  const cells = lines.map(l => l.split('\t'));
  let h = cells.findIndex(r => r.some(c => ['livraison', 'liv'].includes(norm(c))) && r.some(c => /date/i.test(c)));
  let M;
  if (h >= 0) M = headerMap(cells[h], AF_SPEC);
  else { // pas d'en-tête : on reconnaît le format au nombre de colonnes
    h = -1; M = Math.max(...cells.map(r => r.length)) >= 20 ? AF_ORDER_NEW : AF_ORDER_OLD;
  }
  if (M.liv == null || M.date == null) throw new Error('Colonnes « Liv » / « Livraison » et date d’enlèvement introuvables.');
  const out = [];
  for (const r of cells.slice(h + 1)) {
    const g = k => M[k] == null ? '' : (r[M[k]] ?? '');
    const liv = str(g('liv')).replace(/\s/g, '');
    const date = toIso(str(g('date')));
    if (!/^\d{6,}$/.test(liv) || !date) continue;   // ignore la ligne de totaux
    const comm = str(g('comm'));
    const rdv = comm.match(/(?:rv|rb|rdv|rendez[- ]vous|livraison)\s*(?:(?:a|à|de|entre)\s*)?(\d{1,2})\s*[h:]\s*(\d{2})?/i) || comm.match(/\b(\d{1,2})[h:](\d{2})\b/i) || comm.match(/\b(\d{1,2})\s*h\b/i);
    const cam = comm.match(/CAMION\s*(\d+)/i);
    out.push({
      date, liv, client: str(g('client')), prep: str(g('prep')), prepOk: accessBool(g('prep')), affret: accessBool(g('affret')), depot: str(g('depot')),
      transp: str(g('transp')), transpNom: str(g('transpNom')), nom: str(g('nom')), ville: str(g('ville')), rue: [str(g('rue')), str(g('rue4'))].filter(Boolean).join(' · '), cp: str(g('cp')),
      poids: num(g('poids')), poidsTax: num(g('poidsTax')), blocs: num(g('blocs')), pal: num(g('pal')), palEnt: num(g('palEnt')),
      couches: num(g('couches')), cartDet: num(g('cartDet')), cartPk: num(g('cartPk')), comm,
      rdv: rdv ? `${pad(+rdv[1])}:${rdv[2] || '00'}` : '', camion: cam ? cam[1] : '',
    });
  }
  return out;
}

// Rapatriements (classeur par entrepôt externe et par semaine : 2026_S40_FM.xlsx)
const DAY_RE = /^(LUNDI|MARDI|MERCREDI|JEUDI|VENDREDI|SAMEDI|DIMANCHE)/i;
const RP_SPEC = {
  dt: ['n° DT', 'BL'], dest: ['Destinataire'], date: ['A LIVRER LE', 'Date Détournement', 'Date'], art: ['Article', 'Produit'],
  des: ['Désignation article', 'Description', 'Désignation'], sscc: ['Unité stk', 'Unité de stock', 'Unité Manutention', 'Attribut'],
  qte: ['Qté', 'Qtés.', 'Qte', 'Stock total', 'Stock disponible', 'Stock'], pal: ['Pal', 'Nb Pal'], poids: ['Poids Kg', 'Poids (A.S)', 'Poids'],
  lot: ['Lot', 'Origin Code'], remorque: ['N° Remorque'], usine: ['Usine Prod.'], livE: ['Liv. Entr.'], livS: ['Liv. Sort.'], dlc: ['Date péremption/DLC', 'DLUO'],
};
function parseRapatWorkbook(wb, fileName) {
  const m = fileName.match(/(\d{4})_S(\d{1,2})_(.+?)\.xls/i);
  const year = m ? +m[1] : isoWeek(today()).y, week = m ? +m[2] : null;
  const entrepot = m ? m[3].replace(/_/g, ' ').trim() : fileName.replace(/\.xls.*$/i, '');
  const monday = week ? mondayOf(year, week) : null;
  let day = null; const loads = [];
  for (const name of wb.SheetNames) {
    const dm = name.match(DAY_RE);
    if (dm) { day = ['LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI', 'DIMANCHE'].indexOf(dm[1].toUpperCase()); continue; }
    const rows = sheetRows(wb.Sheets[name]);
    if (rows.length < 2) continue;
    const hi = rows.findIndex(r => r.filter(c => c != null && c !== '').length >= 3);
    if (hi < 0) continue;
    const H = rows[hi]; const M = headerMap(H, RP_SPEC);
    if (M.art == null && M.des == null) continue;
    const isNav = M.remorque != null || H.some(c => norm(c) === 'datedetournement');
    const lines = [];
    for (const r of rows.slice(hi + 1)) {
      const g = k => M[k] == null ? null : r[M[k]];
      const art = str(g('art')), des = str(g('des'));
      if (!art && !des) continue;
      if (/^total/i.test(art) || /^total/i.test(des)) continue;
      lines.push({ art, des, sscc: str(g('sscc')), qte: num(g('qte')), pal: M.pal != null ? num(g('pal')) : 1, poids: num(g('poids')), lot: str(g('lot')), date: toIso(g('date')), dlc: toIso(g('dlc')) });
    }
    if (!lines.length) continue;
    const first = rows.slice(hi + 1).find(r => M.remorque != null && r[M.remorque] != null);
    const g0 = k => first && M[k] != null ? str(first[M[k]]) : '';
    let date = lines.map(l => l.date).find(Boolean) || null, approx = false;
    if (!date && monday) { date = addDays(monday, day ?? 0); approx = day == null; }
    const kind = isNav ? 'NAV' : (/^DESTO/i.test(name) || M.dt == null ? 'DESTO' : 'DT');
    const dtNo = M.dt != null ? str(rows[hi + 1][M.dt]) : '';
    loads.push({
      id: `${entrepot}|${year}-S${week}|${name}`, file: fileName, entrepot, year, week, sheet: name, kind,
      sens: kind === 'DT' ? 'in' : 'out', date, approx,
      ref: dtNo || name, remorque: g0('remorque'), usine: g0('usine'), livE: g0('livE'), livS: g0('livS'),
      pal: sum(lines, l => l.pal), poids: sum(lines, l => l.poids), qte: sum(lines, l => l.qte), nbArt: new Set(lines.map(l => l.art || l.des)).size,
      lines: lines.map(({ date, ...l }) => l),
    });
  }
  return { entrepot, week, year, loads };
}

// Planning réceptions sous-traitants (Planning_Reception_SST_Monteux3 : un onglet « PlanningReception AAAA »,
// une ligne par créneau ; seuls les créneaux avec un RDV ou des palettes sont retenus)
const SST_SPEC = {
  date: ['Date réception', 'Date de réception', 'Date livraison', 'Date', 'Jour'], heure: ['Créneau', 'Heure RDV', 'Horaire', 'Heure'],
  sst: ['RDV Sous-Traitant', 'Sous-traitant', 'Sous traitant', 'SST', 'Fournisseur', 'Expéditeur', 'Provenance'],
  ref: ['N° commande', 'Commande', 'PO', 'Référence', 'N° livraison', 'BL'],
  pal: ['Nb Palettes', 'Palettes', 'Nb pal', 'Nombre de palettes'], cam: ['Nb Camion', 'Nb Camions', 'Camions'],
  arr: ['Heure Arrivée', 'Arrivée'], dep: ['Heure départ', 'Départ'],
  quai: ['Quai', 'Porte'], comm: ['Commentaire', 'Commentaires', 'Observations', 'Remarque'], statut: ['Statut', 'Etat', 'Réceptionné'],

function timeStr(v) {
  if (typeof v === 'number' && v >= 0 && v < 1) { const mn = Math.round(v * 1440); return `${pad(Math.floor(mn / 60))}:${pad(mn % 60)}`; }
  const m = String(v ?? '').match(/(\d{1,2})\s*[h:]\s*(\d{2})?/i);
  return m ? `${pad(+m[1])}:${m[2] || '00'}` : '';
}
function parseSST(wb, fileName) {
  const out = [];
  for (const name of wb.SheetNames) {
    if (/cumul|ne pas toucher|synth|tcd/i.test(name)) continue;   // tableaux croisés et onglet technique
    const rows = sheetRows(wb.Sheets[name]);
    const hi = rows.slice(0, 25).findIndex(r => r.some(c => /date|jour/i.test(String(c ?? ''))) && r.filter(c => c != null && c !== '').length >= 3);
    if (hi < 0) continue;
    const M = headerMap(rows[hi], SST_SPEC);
    if (M.date == null || (M.sst == null && M.pal == null)) continue;
    let lastDate = null;
    for (const r of rows.slice(hi + 1)) {
      const g = k => M[k] == null ? null : r[M[k]];
      const d0 = toIso(g('date')); const d = d0 || lastDate; if (d0) lastDate = d0;
      const sst = str(g('sst')).replace(/\s+/g, ' '), refv = str(g('ref')), pal = num(g('pal'));
      if (!d || (!sst && !refv && !pal)) continue;
      const heure = timeStr(g('heure')), arr = timeStr(g('arr')), dep = timeStr(g('dep'));
      const stv = str(g('statut'));
      out.push({
        id: `${d}|${heure}|${sst.toUpperCase()}|${refv}`, date: d, heure, sst, ref: refv, pal, cam: M.cam != null ? num(g('cam')) : (pal ? 1 : 0),
        arr, dep, quai: str(g('quai')), comm: str(g('comm')),
        recu: !!arr || /^(oui|ok|x|re[cç]u|r[ée]ceptionn[ée]|fait|1|true)$/i.test(stv), src: fileName + ' / ' + name,
      });
    }
  }
  return out;
}

// Référentiels : FichierArticle.XLSX, MLGT.XLSX, ou le classeur Analyse_Activité_Préparation lui-même
function parseRefs(wb) {
  const res = {};
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]); if (!rows.length) continue;
    const H = rows[0].map(norm);
    if (H.includes('article') && H.includes('uqa') && (H.includes('numer') || H.includes('uqpal'))) {
      const M = headerMap(rows[0], { art: ['Article'], tyar: ['TyAr'], uqa: ['UQA'], uq: ['UQ'], n: ['Numér.', 'UQ/PAL'], g4: ["Groupe d'articles 4"], g5: ["Groupe d'articles 5"] });
      const arts = {};
      for (const r of rows.slice(1)) {
        const a = typeof r[M.art] === 'number' ? String(r[M.art]) : str(r[M.art]); if (!a || arts[a]) continue;
        const tyar = str(r[M.tyar]), uqa = str(r[M.uqa]);
        if (uqa !== 'PAL' || tyar === 'ROH' || tyar === 'ZNVM') continue;   // filtre PQ Fichier_Article
        arts[a] = [tyar, uqa, str(r[M.uq]), num(r[M.n]) || null, M.g4 != null ? str(r[M.g4]) : '', M.g5 != null ? str(r[M.g5]) : ''];
      }
      if (Object.keys(arts).length) res.articles = arts;
    } else if (H.includes('matnr') && H.includes('lgpla')) {
      const iA = H.indexOf('matnr'), iP = H.indexOf('lgpla'); const ml = {};
      for (const r of rows.slice(1)) { const a = typeof r[iA] === 'number' ? String(r[iA]) : str(r[iA]); if (a && !(a in ml)) ml[a] = str(r[iP]); }
      res.mlgt = ml;
    } else if (H.includes('magasin') && H.includes('lieupreparation')) {
      const mg = {}; for (const r of rows.slice(1)) { let k = str(r[0]); if (/^\d+$/.test(k)) k = k.padStart(4, '0'); if (k) mg[k] = str(r[1]); }
      res.magasins = mg;
    }
  }
  return res;
}

// ---------- Graphiques SVG (barres groupées / empilées) ----------
// series: [{key,label,color}], cats: [{label,sub}], data[catIdx][key]
function barChart({ cats, series, data, stacked = false, unit = '', fmt = n0, height = 240, ref = null, marks = null }) {
  const refs = (ref ? [].concat(ref) : []).filter(r => r && r.value > 0);
  const W = 640, H = height, ml = 44, mr = 8, mt = 18, mb = 38;
  const iw = W - ml - mr, ih = H - mt - mb;
  const totals = data.map(d => stacked ? sum(series, s => d[s.key]) : Math.max(0, ...series.map(s => d[s.key] || 0)));
  let max = Math.max(1, ...totals, ...refs.map(r => r.value * 1.08), ...(marks || []).filter(Boolean).map(m => m.value * 1.1));
  const step = niceStep(max / 4); max = Math.ceil(max / step) * step;
  const y = v => mt + ih - (v / max) * ih;
  const bw = iw / cats.length;
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line class="gridline" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-t" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  let bars = '', hits = '';
  cats.forEach((c, i) => {
    const x0 = ml + i * bw;
    g += `<text class="axis-t" x="${x0 + bw / 2}" y="${H - mb + 16}" text-anchor="middle">${esc(c.label)}</text>`;
    if (c.sub) g += `<text class="axis-t" x="${x0 + bw / 2}" y="${H - mb + 30}" text-anchor="middle" opacity=".8">${esc(c.sub)}</text>`;
    const d = data[i];
    if (stacked) {
      const w = Math.min(46, bw * .5); let acc = 0; const xs = x0 + (bw - w) / 2;
      series.forEach((s, si) => {
        const v = d[s.key] || 0; if (v <= 0) return;
        const y1 = y(acc + v), y0 = y(acc); const hgt = Math.max(0, y0 - y1 - (acc > 0 ? 2 : 0));
        const top = si === series.length - 1 || series.slice(si + 1).every(t => !(d[t.key] > 0));
        bars += roundedBar(xs, y1, w, hgt, top ? 4 : 0, s.color);
        acc += v;
      });
      if (acc > 0) bars += `<text class="val-t" x="${xs + w / 2}" y="${y(acc) - 5}" text-anchor="middle">${fmt(acc)}</text>`;
    } else {
      const n = series.length, gap = 2, w = Math.min(30, (bw * .7 - gap * (n - 1)) / n);
      const xs = x0 + (bw - (w * n + gap * (n - 1))) / 2;
      series.forEach((s, si) => {
        const v = d[s.key] || 0; const x = xs + si * (w + gap);
        if (v > 0) { bars += roundedBar(x, y(v), w, y(0) - y(v), 4, s.color); bars += `<text class="val-t" x="${x + w / 2}" y="${y(v) - 5}" text-anchor="middle">${fmt(v)}</text>`; }
      });
    }
    const mk = marks && marks[i];
    if (mk) { const mw = Math.min(70, bw * .62), mx = x0 + (bw - mw) / 2; bars += `<line x1="${mx}" x2="${mx + mw}" y1="${y(mk.value)}" y2="${y(mk.value)}" stroke="var(--crit)" stroke-width="3" stroke-dasharray="6 3" stroke-linecap="round"/><text class="val-t" x="${mx + mw + 4}" y="${y(mk.value) + 4}" text-anchor="start" style="fill:var(--crit-ink);font-size:10px">${fmt(mk.value)}</text>`; }
    const tipHtml = `<b>${esc(c.tip || c.label)}</b>` + (mk ? `<div><i style="background:var(--crit)"></i>Limite réelle : <b style="display:inline">${fmt(mk.value)}${unit}</b></div>` : '') + series.map(s => `<div><i style="background:${s.color}"></i>${esc(s.label)} : <b style="display:inline">${fmt(d[s.key] || 0)}${unit}</b></div>`).join('') + (stacked ? `<div>Total : <b style="display:inline">${fmt(totals[i])}${unit}</b></div>` : '');
    hits += `<rect x="${x0}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(tipHtml)}"/>`;
  });
  g += `<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  // lignes de capacité : trait sombre sur liseré clair (visible même sur une barre de même couleur), repère coloré à gauche

  }

  const th = cols.map(c => `<th class="${c.num ? 'num' : ''}" data-sort="${id}|${c.k}" scope="col">${esc(c.label)}${st && st.k === c.k ? `<span class="sort-ind">${st.d > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('');

}

function intercoRows() {
  const idx = livIndex();
  const map = new Map();
  for (const l of idx.values()) if (isInterco(l.nom, l.prio)) map.set(l.liv, { liv: l.liv, nom: l.nom, ville: l.ville, date: l.dc, v: l });
  for (const r of Object.values(S.affret.rows)) if (isInterco(r.nom, idx.get(r.liv)?.prio)) { const e = map.get(r.liv) || { liv: r.liv, nom: r.nom, ville: r.ville, v: idx.get(r.liv) }; e.a = r; e.date = r.date; map.set(r.liv, e); }
  const rows = [...map.values()].filter(e => inWeek(e.date)).map(e => ({
    date: e.date, liv: e.liv, nom: e.nom, ville: e.ville, dest: destGroup(e.nom),
    pal: e.a ? e.a.pal : null, palSilo: e.v ? e.v.palSilo : null, colis: e.v ? e.v.total : null, colisPick: e.v ? e.v.colisPick : null,

  }));
  return rows;
}

    : '<div class="empty"><b>Aucun interco cette semaine</b>Importez la VL06O, la base affrètement ou le planning SST.</div>'}

function destGroup(nom) {
  const u = compact(nom);
  const k = S.settings.intercoKeys.find(k => k && u.includes(compact(k)));
  if (!k) return nom || '—';
  if (/MCCORMICK/.test(k.toUpperCase())) return nom; // plusieurs sites McCormick : garder le nom complet
  return k.charAt(0) + k.slice(1).toLowerCase();
}

//   NAVETTES USINES (copier-coller VL06I) : entrées au dépôt
//   - seuls les sites usines retenus (2560 Carpentras, 2510 usine épices par défaut)
//   - palettes = nombre de colis (vide = navette pas encore chargée : 0, rien n'est estimé)
//   - date dépassée : la navette est encore attendue, elle compte le jour de la VL06I
//   - pas d'horaire : ramenées au fil de la journée par les chauffeurs de parc

function parseVL06I(txt) {
  const rows = [];
  for (const line of String(txt).split(/\r?\n/)) {
    let c = line.split('\t'); if (c.length < 6) c = line.trim().split(/\s{2,}/);
    const liv = str(c[0]).replace(/\D/g, ''), dm = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/.exec(str(c[1]));
    if (!/^\d{6,}$/.test(liv) || !dm) continue;
    rows.push({ liv, date: `${dm[3]}-${pad(+dm[2])}-${pad(+dm[1])}`, site: str(c[2]), nom: str(c[3]), dest: str(c[4]), colis: num(c[5]), user: str(c[6]), ref: str(c[7]), poids: num(c[8]) });
  }
  return rows;
}
const navSites = () => String(S.settings.navSites || '').split(/[\s,;]+/).filter(Boolean);
function navRows() {
  if (!S.nav) return [];
  const sites = navSites(), rows = S.nav.rows.filter(r => !sites.length || sites.includes(r.site));
  return rows.map(r => Object.assign({}, r, {
    pal: r.colis > 0 ? r.colis : 0,             // pas de colis = navette pas encore chargée : rien d'inventé
    loaded: r.colis > 0,
    dateEff: r.date < S.nav.snap ? S.nav.snap : r.date, late: r.date < S.nav.snap,
  }));
}
function viewNav() {
  // la VL06I remplace la précédente : une navette absente du nouveau collage a été déchargée → on affiche simplement les navettes en cours
  const all = navRows(), ex = S.nav ? S.nav.rows.length - all.length : 0;
  const bar = srcBar(S.nav ? `VL06I du ${esc(fdt(S.nav.at))}${ex ? ` · ${ex} ligne(s) d’autres sites ignorée(s)` : ''}` : '<b>VL06I non collée</b>', !S.nav);
  if (!all.length) return bar + `<section class="card glass"><div class="empty"><b>Aucune navette en cours</b>${S.nav ? 'Toutes les navettes de la dernière VL06I ont été déchargées.' : 'Collez la VL06I dans l’onglet Sources.'}</div></section>`;
  const rows = all.slice().sort((a, b) => a.date.localeCompare(b.date) || a.nom.localeCompare(b.nom));
  return bar + `<section class="card glass"><h2>Navettes en cours <span class="meta" style="font-weight:500">· ${rows.length} navette${rows.length > 1 ? 's' : ''} · ${n0(sum(rows, r => r.pal))} palettes</span></h2>

}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = (k === 'site' || k === 'siteExt') ? t.value : t.value.trim() === '' ? DEFAULT_SETTINGS[k] : num(t.value); save('settings'); render(); }   // 0 autorisé
  if (t.dataset.setlist) { S.settings[t.dataset.setlist] = t.value.split('\n').map(s => s.trim()).filter(Boolean); save('settings'); render(); }
  if (t.dataset.likpset) { const [liv, D] = t.dataset.likpset.split('|'); S.likp = S.likp || { importedAt: Date.now(), map: {} };
    if (t.value) S.likp.map[liv] = { d: D, t: t.value, route: (S.likp.map[liv] || {}).route || '', manual: true }; else delete S.likp.map[liv];
    save('likp'); render(); }
  if (t.dataset.crule) { const [i, k] = t.dataset.crule.split('|'); S.settings.creneauxClients[+i][k] = k === 'ref' ? +t.value : t.value; save('settings'); render(); }
  if (t.dataset.setstr) { S.settings[t.dataset.setstr] = t.value; save('settings'); render(); }
  if (t.dataset.setsel) { S.settings[t.dataset.setsel] = +t.value; save('settings'); render(); }
  if (t.dataset.setchk) { S.settings[t.dataset.setchk] = t.checked; save('settings'); render(); }
  if (t.dataset.team) { const [key, i, k] = t.dataset.team.split('|'); S.settings[key][+i][k] = k === 'prep' ? (t.type === 'checkbox' ? (t.checked ? 1 : 0) : num(t.value)) : t.value; save('settings'); render(); }
  if (t.dataset.jour != null && t.type === 'checkbox') { S.settings.joursTrav = (S.settings.joursTrav || [1, 1, 1, 1, 1, 0, 0]).slice(); S.settings.joursTrav[+t.dataset.jour] = t.checked ? 1 : 0; save('settings'); render(); }
  if (t.dataset.transp) { const v = t.value.trim(); if (v) S.settings.transporteurs[t.dataset.transp] = v; else delete S.settings.transporteurs[t.dataset.transp]; save('settings'); }
});
let qT;
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.q) return;
  S.ui[t.dataset.q].q = t.value; clearTimeout(qT);
  qT = setTimeout(() => { const pos = t.selectionStart; render(); const n = document.querySelector(`[data-q="${t.dataset.q}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
});

// ---------- Actions ----------
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'pf-reset') { S.ui.pf = {}; render(); }
  if (a === 'team-add') { const k = b.dataset.k; S.settings[k] = [...(S.settings[k] || []), { nom: 'Équipe', debut: '20:00', fin: '03:30', prep: 1 }]; save('settings'); render(); }
  if (a === 'team-del') { const k = b.dataset.k; S.settings[k] = S.settings[k].filter((_, i) => i !== +b.dataset.i); save('settings'); render(); }
  if (a === 'aff-import') {
    try {
      const rows = parseAffret($('#affPaste').value);
      if (!rows.length) return toast('Aucune ligne reconnue : vérifiez que la colonne « Livraison » et la date sont présentes.');
      if ($('#affReplace').checked) { const ds = new Set(rows.map(r => r.date)); for (const [k, r] of Object.entries(S.affret.rows)) if (ds.has(r.date)) delete S.affret.rows[k]; }
      let nw = 0; S.affret.tnames = S.affret.tnames || {}; S.affret.importedAt = Date.now();
      for (const r of rows) { if (!S.affret.rows[r.liv]) nw++; S.affret.rows[r.liv] = r; if (r.transp && r.transpNom) S.affret.tnames[r.transp] = r.transpNom; }

async function handleFiles(kind, files, auto) {
  if (!files.length) return;

    if (kind === 'restore') {
      const j = JSON.parse(await files[0].text()); if (j.app !== 'flux-hebdo') throw new Error('Fichier de sauvegarde non reconnu');
      await applyBackup(j); toast('Sauvegarde restaurée'); return render();
    }
    toast('Lecture en cours…', 1500);
    if (kind === 'vl06o') {
      const wb = await readWorkbook(files[0]); const rows = parseVL06O(wb);
      const now = Date.now(); S.prep = { file: files[0].name, importedAt: now, extractedAt: Math.min(files[0].lastModified || now, now), rows }; await save('prep');
      await updateHist();
      S.ui.pf = {};
      const ds = uniq(rows.map(r => r.dc)).filter(Boolean).sort(); if (ds.length && !weekData().prep.length) S.ui.week = isoWeek(ds[0]);
      toast(`<b>VL06O importée</b> : ${n0(rows.length)} postes, ${n0(uniq(rows.map(r => r.liv)).length)} livraisons (${ds.map(fdate).join(', ')})`);
    }
    if (kind === 'likp') {
      const wb = await readWorkbook(files[0]); const map = parseLIKP(sheetRows(wb.Sheets[wb.SheetNames[0]])); const n = Object.keys(map).length;
      if (!n) throw new Error('Aucune livraison reconnue dans le fichier LIKP (VBELN / Livraison + date de chargement attendus).');
      S.likp = { importedAt: Date.now(), map: Object.assign({}, S.likp ? S.likp.map : {}, map) }; await save('likp');
      toast(`<b>${n} heures de chargement importées</b>`);
    }
    if (kind === 'rapat') {
      let n = 0, pal = 0; const msgs = [];
      for (const f of files) {
        const wb = await readWorkbook(f); const res = parseRapatWorkbook(wb, f.name);
        for (const [k, l] of Object.entries(S.rapat.loads)) if (l.file === f.name) delete S.rapat.loads[k];
        for (const l of res.loads) S.rapat.loads[l.id] = l;
        n += res.loads.length; pal += sum(res.loads, l => l.pal); msgs.push(`${esc(res.entrepot)} S${res.week ?? '?'} : ${res.loads.length} camion(s)`);
        if (!auto && res.loads.length && files.length === 1) S.ui.week = isoWeek(res.loads[res.loads.length - 1].date);
      }
      await save('rapat'); toast(`<b>${n} chargements · ${n0(pal)} palettes</b><br>${msgs.join('<br>')}`, 5000);
    }
    if (kind === 'sst') {
      let n = 0;
      for (const f of files) {
        const wb = await readWorkbook(f); const rows = parseSST(wb, f.name);
        const prev = new Map(S.sst.rows.filter(r => r.src.startsWith(f.name + ' / ')).map(r => [r.id, r]));
        for (const r of rows) { const p = prev.get(r.id); if (p && p.recu) r.recu = true; }
        S.sst.rows = S.sst.rows.filter(r => !r.src.startsWith(f.name + ' / ')).concat(rows); n += rows.length;
      }
      await save('sst'); toast(n ? `<b>${n} réceptions importées</b>` : 'Aucune ligne reconnue — envoyez le fichier pour adapter la lecture (colonne « Date » requise).', 5000);
    }
    if (kind === 'ref') {
      const cur = S.ref ? structuredClone(S.ref) : structuredClone(window.REF_DEFAULT || { articles: {}, mlgt: {}, magasins: {} });
      const got = [];
      for (const f of files) { const r = parseRefs(await readWorkbook(f)); if (r.articles) { cur.articles = r.articles; got.push(`${n0(Object.keys(r.articles).length)} articles`); } if (r.mlgt) { cur.mlgt = r.mlgt; got.push(`${n0(Object.keys(r.mlgt).length)} emplacements`); } if (r.magasins) { cur.magasins = r.magasins; got.push('magasins'); } }
      if (!got.length) throw new Error('Aucun référentiel reconnu (Fichier Article, MLGT ou Data_Magasins).');
      cur.date = today(); cur.importedAt = Date.now(); S.ref = cur; await save('ref'); toast('Référentiel mis à jour : ' + got.join(', '));
    }
    render();
  } catch (err) { console.error(err); toast('<b>Import impossible</b><br>' + esc(err.message || err), 6000); }
}

async function purgeRun() {

  const before = old ? mondayOf(S.ui.week.y, S.ui.week.w) : null;
  const keep = d => before && d && d >= before;
  const keys = ['prep', 'affret', 'rapat', 'sst', 'nav', 'ref', 'settings'].filter(sel);
  if (!keys.length) return toast('Rien de sélectionné.');

  if (sel('rapat')) for (const [k, l] of Object.entries(S.rapat.loads)) if (!keep(l.date)) delete S.rapat.loads[k];

  if (settings) S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), settings);
  if (!(S.settings.settingsV >= 2)) { S.settings.prepDelai = 0; S.settings.likpDefaut = '12:00'; S.settings.settingsV = 2; save('settings'); }   // v1.13 : règle « la veille » trop pessimiste
  if (!(S.settings.settingsV >= 3)) { if (!(S.settings.equipesSilo || []).some(e => hm(e.debut) >= 19)) S.settings.equipesSilo = [...(S.settings.equipesSilo || []), { nom: 'Nuit', debut: '20:00', fin: '03:30', prep: 1 }]; S.settings.settingsV = 3; save('settings'); }   // v1.15 : équipe SILO de nuit
  if (refd) S.ref = refd; if (prep) S.prep = prep; if (affret) S.affret = affret; if (rapat) S.rapat = rapat; if (sst) S.sst = sst;
  SPLASH.step('db', 'done', S.prep ? `VL06O ${fdt(snapTs())}` : 'aucune VL06O');
  SPLASH.step('calc', 'active');
  render();
  { const P = projection(); SPLASH.step('calc', 'done', P ? `${P.items.length} livraisons à préparer` : `semaine ${S.ui.week.w}`); }
  SY.muted = false;
  SPLASH.step('sync', 'active', 'recherche…');
  await syncInit();
  SPLASH.finish();
  srcAuto();
  if (!window.XLSX) toast('⚠ SheetJS n’a pas pu être chargé : gardez le dossier lib/ à côté du fichier de l’app.', 8000);
})();
</script>
