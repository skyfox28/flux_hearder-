    --good-ink:#3fcf3f; --warn-ink:#fab219; --crit-ink:#ff7b7b;
    --chip:rgba(255,255,255,.08); --chip-on:#f3f5fa; --chip-on-ink:#0e1422;
    --input:rgba(10,14,26,.55);
    --row-hover:rgba(57,135,229,.12);
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --bg-1:#0b1020; --bg-2:#141026; --bg-3:#0b1a1a;
    --blob-1:#1d4d9a; --blob-2:#8a3a1c; --blob-3:#0f6b4e; --blob-4:#3d2f8f;
    --glass: rgba(28,34,52,.48);
    --glass-strong: rgba(34,40,60,.72);
    --glass-soft: rgba(255,255,255,.05);
    --glass-border: rgba(255,255,255,.14);
    --glass-edge: rgba(0,0,0,.3);
    --glass-shine: rgba(255,255,255,.22);
    --shadow: 0 12px 44px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.4);
    --text-1:#f3f5fa; --text-2:#b9c0d2; --text-3:#8a93a8;
    --grid:#2e3446; --axis:#4a5266;
    --accent:#3987e5;
    --in:#3987e5; --out:#d95926; --silo:#9085e9; --pick:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
    --good-ink:#3fcf3f; --warn-ink:#fab219; --crit-ink:#ff7b7b;
    --chip:rgba(255,255,255,.08); --chip-on:#f3f5fa; --chip-on-ink:#0e1422;
    --input:rgba(10,14,26,.55);
    --row-hover:rgba(57,135,229,.12);
}
*{box-sizing:border-box}
svg[aria-hidden="true"]{width:18px;height:18px;flex:none}
html,body{margin:0;min-height:100%}
html{background:var(--bg-1)}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; color:var(--text-1);
  background:linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.blobs i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--blob-1)}
.blobs i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:8vh;background:var(--blob-2);opacity:.45}
.blobs i:nth-child(3){width:42vw;height:42vw;left:25vw;bottom:-18vw;background:var(--blob-3);opacity:.45}
.blobs i:nth-child(4){width:26vw;height:26vw;right:18vw;bottom:10vh;background:var(--blob-4);opacity:.4}

.glass{
  position:relative;
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-shine), inset 0 -1px 0 var(--glass-edge);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%);
  opacity:.55;
}
:root[data-theme="dark"] .glass::before{opacity:.12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glass::before{opacity:.12}}

.app{position:relative;z-index:1;display:grid;grid-template-columns:232px 1fr;gap:18px;padding:18px;min-height:100vh}
aside.nav{position:sticky;top:18px;align-self:start;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand .logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--in),var(--silo));color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.brand b{display:block;font-size:15px}
.brand small{color:var(--text-3);font-size:12px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--text-2);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--glass-soft);color:var(--text-1)}
.nav button.on{background:var(--glass-strong);color:var(--text-1);box-shadow:inset 0 1px 0 var(--glass-shine),0 2px 8px rgba(0,0,0,.08)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .sep{height:1px;background:var(--glass-border);margin:10px 8px}
.nav .foot{margin-top:auto;padding:10px 12px 0;color:var(--text-3);font-size:12px;line-height:1.5}

main{min-width:0;display:flex;flex-direction:column;gap:18px}
#view{grid-template-columns:minmax(0,1fr)}
#view > *{min-width:0}
header.top{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--text-3);font-size:13px}
.spacer{flex:1}
.weekpick{display:flex;align-items:center;gap:6px;background:var(--glass-soft);border:1px solid var(--glass-border);border-radius:999px;padding:4px}
.weekpick b{min-width:150px;text-align:center;font-weight:600}
.weekpick small{display:block;font-weight:400;color:var(--text-3);font-size:11px}
.iconbtn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--text-2)}
.iconbtn:hover{background:var(--glass-strong);color:var(--text-1)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.iconbtn svg{width:18px;height:18px}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;
  background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--text-1);box-shadow:inset 0 1px 0 var(--glass-shine),0 2px 6px rgba(0,0,0,.06)}
.btn:hover{filter:brightness(1.04)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:#fff;border-color:transparent}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn svg{width:16px;height:16px}

section.card{padding:18px 20px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:650}
.card .hint{color:var(--text-3);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.card-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-head > div:first-child{flex:1;min-width:200px}
.card-head .hint{margin:0}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{padding:14px 16px;border-radius:18px;background:var(--glass-soft);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-shine)}
.kpi .lab{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .lab i{width:8px;height:8px;border-radius:3px;display:inline-block}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;font-weight:500;color:var(--text-3);margin-left:4px}
.kpi .det{font-size:12px;color:var(--text-3);margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:8px}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--good)}

.group-title{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.group-title::after{content:"";flex:1;height:1px;background:var(--glass-border)}

.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fgroup > label{font-size:12px;color:var(--text-3);margin-right:2px}
.chip{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--chip);border:1px solid color-mix(in srgb,var(--text-3) 30%,transparent);color:var(--text-2)}
.chip:hover{color:var(--text-1)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.search,select.inp,input.inp,textarea.inp{font:inherit;color:var(--text-1);background:var(--input);border:1px solid var(--glass-border);border-radius:12px;padding:8px 12px;outline:none}
input.search:focus,select.inp:focus,input.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input.search{min-width:220px;border-radius:999px}
textarea.inp{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass-soft);border:1px solid var(--glass-border);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font-weight:500;font-size:13px;color:var(--text-2)}
.tabs button.on{background:var(--glass-strong);color:var(--text-1);box-shadow:inset 0 1px 0 var(--glass-shine),0 2px 6px rgba(0,0,0,.08)}

.tbl-wrap{overflow:auto;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass-soft);max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;z-index:2;background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);text-align:left;font-weight:600;font-size:12px;color:var(--text-2);padding:9px 10px;border-bottom:1px solid var(--glass-border);white-space:nowrap;cursor:pointer;user-select:none}
.t th.num,.t td.num{text-align:right}
.t td{padding:7px 10px;border-bottom:1px solid color-mix(in srgb,var(--grid) 60%,transparent);white-space:nowrap}
.t tbody tr:hover td{background:var(--row-hover)}
.t tr.sub td{font-weight:600;background:color-mix(in srgb,var(--glass-strong) 60%,transparent)}
.t tr.tot td{font-weight:700;background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);position:sticky;bottom:0;z-index:1;border-top:1px solid var(--glass-border)}
.t tr.pct td{color:var(--text-2);font-style:italic}
.t td.wrap{white-space:normal;min-width:220px;max-width:420px}
.t td.muted{color:var(--text-3)}
.t tr.clickable{cursor:pointer}
.t tr.detail td{background:color-mix(in srgb,var(--glass-soft) 80%,transparent);padding:0}
.t .sort-ind{opacity:.5;margin-left:4px;font-size:10px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-good{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
.b-warn{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.b-crit{color:var(--crit-ink);background:color-mix(in srgb,var(--crit) 13%,transparent)}
.b-neutral{color:var(--text-2);background:var(--chip)}
.b-info{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.b-nodot::before{display:none}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--glass-soft);border:1px solid var(--glass-border);font-size:13px}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert.crit svg{color:var(--crit-ink)} .alert.warn svg{color:var(--warn-ink)} .alert.info svg{color:var(--accent)}
.alert b{font-weight:600}
.alert .x{color:var(--text-3);font-size:12px;margin-top:2px}

.drop{border:1.5px dashed color-mix(in srgb,var(--text-3) 60%,transparent);border-radius:18px;padding:18px;text-align:center;color:var(--text-2);background:var(--glass-soft);transition:.15s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.drop b{color:var(--text-1)}
.drop > svg{width:26px;height:26px;display:block;margin:0 auto 8px;color:var(--text-3)}
.drop small{display:block;color:var(--text-3);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{font-size:12px;color:var(--text-3)}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text-2);font-size:14px;margin-bottom:4px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axis-t{fill:var(--text-3);font-size:11px}
.chart .val-t{fill:var(--text-2);font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:12px;font-size:12px;line-height:1.5;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:var(--shadow);color:var(--text-1);opacity:0;transition:opacity .1s;max-width:280px}
.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.matrix td.num.hl{font-weight:700}
.t.slots td{vertical-align:top;min-width:150px;white-space:normal;padding:5px 6px}
.slot{display:block;margin:2px 0;padding:4px 8px;border-radius:10px;font-size:12px;line-height:1.35;border:1px solid transparent;background:var(--chip);border-color:color-mix(in srgb,var(--text-3) 25%,transparent)}
.slot b{float:right;margin-left:8px}
.slot.s-ok{background:color-mix(in srgb,var(--good) 16%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.slot.s-late{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.dayhead small{display:block;font-weight:400;color:var(--text-3)}
.toast{position:fixed;right:22px;bottom:22px;z-index:60;padding:12px 16px;border-radius:16px;max-width:420px;font-size:13px;transform:translateY(20px);opacity:0;transition:.25s}
.toast.show{transform:none;opacity:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.set-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3)}
details.paste summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.paste summary::-webkit-details-marker{display:none}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);border:1px solid var(--glass-border)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* indicateurs cliquables + overlay de détail */
.kpi[data-detail]{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi[data-detail]:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--glass-border));box-shadow:inset 0 1px 0 var(--glass-shine),0 8px 24px rgba(30,45,90,.12)}
.kpi[data-detail]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi[data-detail] .lab::after{content:"Détail ›";margin-left:auto;font-size:11px;color:var(--accent);opacity:0;transition:opacity .15s}
.kpi[data-detail]:hover .lab::after,.kpi[data-detail]:focus-visible .lab::after{opacity:1}
td.clk{cursor:pointer}
td.clk:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.purge-scope{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--glass-soft);border:1px solid var(--glass-border)}
.purge-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.purge-opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:var(--glass-soft);border:1px solid var(--glass-border);cursor:pointer}
.purge-opt input{margin-top:3px}
.purge-opt > div{flex:1}
.purge-opt .det{font-size:12px;color:var(--text-3)}
.purge-opt:has(input:disabled){opacity:.55;cursor:default}
.mpanel.xl{width:min(1680px,100%);max-height:96vh;height:96vh}
.modal:has(.mpanel.xl){padding:2vh 12px}
.xlchart{padding:10px 14px 4px;border-radius:18px;background:var(--glass-soft);border:1px solid var(--glass-border);margin-bottom:6px}
.xlcharts > div{padding:12px 14px;border-radius:18px;background:var(--glass-soft);border:1px solid var(--glass-border)}
.clickcard{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.clickcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--glass-border))}
.clickcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clickcard .expand{position:absolute;top:16px;right:18px;font-size:12px;font-weight:600;color:var(--accent);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.daycard{padding:12px 14px;border-radius:16px;background:var(--glass-soft);border:1px solid var(--glass-border)}
.dch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dcs{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:8px 0 2px}
.dcs.in{color:var(--in)} .dcs.out{color:var(--out)}
.daycard ul{list-style:none;margin:0;padding:0}
.daycard li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--grid) 60%,transparent);font-size:12.5px}
.daycard li small{grid-column:1/-1;color:var(--text-3);font-size:11px}
i.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.linkbtn:hover{text-decoration:underline}
.nav .foot .linkbtn{display:inline;padding:0;border-radius:0;color:var(--accent);font-weight:600}
.nav .foot .linkbtn:hover{background:none}
.appfoot{text-align:center;color:var(--text-3);font-size:12px;padding:4px 0 10px}
.reel-line{display:grid;grid-template-columns:60px 1fr;gap:0 8px;align-items:baseline;margin-top:6px}
.reel-line span{font-size:12px;color:var(--text-3)}
.reel-line b{font-size:15px}
.reel-line b.ok{color:var(--good-ink)} .reel-line b.ko{color:var(--crit-ink)}
.reel-line small{grid-column:2;font-size:11.5px;color:var(--text-3)}
.plan{display:flex;flex-direction:column;gap:16px}
.plan-day{padding:14px;border-radius:18px;background:var(--glass-soft);border:1px solid var(--glass-border);border-left:5px solid var(--good)}
.plan-day.late{border-left-color:var(--crit)}
.plan-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.plan-head h3{margin:0 0 2px;font-size:18px}
.plan-prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
.plan-prog .bar{width:180px;margin:0}
.pvs{display:flex;gap:8px;flex-wrap:wrap}
.pv{display:flex;flex-direction:column;padding:8px 12px;border-radius:14px;min-width:120px;border:1px solid var(--glass-border);background:var(--glass-strong)}
.pv span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.pv b{font-size:15px} .pv small{font-size:11.5px;color:var(--text-3)}
.pv.ok b{color:var(--good-ink)} .pv.ko b{color:var(--crit-ink)}
.pv.ko{background:color-mix(in srgb,var(--crit) 8%,var(--glass-strong))}
.t tr.row-late td:first-child{box-shadow:inset 3px 0 0 var(--crit)}

.mback{position:absolute;inset:0;background:rgba(10,15,30,.4);-webkit-backdrop-filter:blur(6px) saturate(120%);backdrop-filter:blur(6px) saturate(120%);animation:fadeIn .15s ease}
.mpanel{position:relative;width:min(1180px,100%);max-height:92vh;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg-1) 90%,transparent);animation:popIn .18s ease}

@media (max-width: 1100px){ .g3{grid-template-columns:1fr 1fr} }
@media (max-width: 900px){
  .app{grid-template-columns:1fr;padding:12px 16px;gap:14px}
  aside.nav{position:sticky;top:8px;z-index:20;flex-direction:row;overflow-x:auto;padding:8px;gap:2px}

}

<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="app">
  <aside class="nav glass" id="nav"></aside>
  <main>
    <header class="top glass">
      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="weekpick" role="group" aria-label="Semaine">
        <button class="iconbtn" id="wPrev" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <b id="wLabel"></b>
        <button class="iconbtn" id="wNext" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <button class="btn sm" id="wToday">Cette semaine</button>
      <button class="btn sm danger" data-detail="purge" title="Purger les données de l’app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg> Purger</button>
      <button class="iconbtn" id="themeBtn" aria-label="Changer de thème" title="Thème clair / sombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <div id="view" class="grid"></div>
    <footer class="appfoot">Flux Hebdo <button class="linkbtn" data-detail="version" id="footVer"></button> · Développé par <b>Galaad Poivey</b></footer>
  </main>
</div>
<div class="tip" id="tip"></div>
<div class="toast glass" id="toast" role="status"></div>
<input type="file" id="fileInput" hidden multiple>

<script>
'use strict';
/* ============================================================
   Flux Hebdo Dépôt — suivi entrées / sorties / préparation
   100 % frontend : les données restent dans le navigateur (IndexedDB)
   ============================================================ */

// ---------- Version (à incrémenter à chaque modification de l'app) ----------
const APP_VERSION = '1.13.1';
const APP_AUTHOR = 'Galaad Poivey';
const CHANGELOG = [
  ['1.13.1', '30/09/2026', 'Sans heure LIKP : échéance estimée le jour même avant 12h (au lieu de la veille au soir, trop pessimiste) ; heure par défaut réglable.'],
  ['1.13.0', '30/09/2026', 'Préparation : vue « Planning de chargement » par jour et créneau (passe / en retard) ; correction de l’affichage des traits de capacité.'],
  ['1.12.0', '30/09/2026', 'Créneaux de chargement LIKP (collage ou Excel, 2 h par défaut) : projection réelle livraison par livraison, livraisons en retard prévu.'],
  ['1.11.0', '30/09/2026', 'Réel : limite réelle par jour (reste VL06O vs capacité restante), verdict « passe / ne passe pas », fin estimée, rendement réel mesuré entre deux imports.'],
  ['1.10.0', '30/09/2026', 'Capacité quai : 2 250 pal/semaine en entrée et 3 000 en sortie ; taux de charge SILO et picking dissociés (équipes SILO paramétrables).'],
  ['1.9.0', '30/09/2026', 'Grands détails plein écran « Flux palettes » et « Charge SILO / picking », numéro de version, crédits.'],
  ['1.8.0', '30/09/2026', 'Bouton Purger : suppression sélective des données.'],
  ['1.7.0', '30/09/2026', 'Livraison absente de la VL06O = expédiée ; départs directs Compans (COLRUYT, dépôt 540) hors totaux.'],
  ['1.6.0', '30/09/2026', 'Capacité picking : équipes (2 + 2 préparateurs), taux de charge, préparateurs nécessaires.'],
  ['1.5.0', '30/09/2026', 'Nouveau format de la base affrètement ; livraisons VL06O non affrétées dans Expéditions.'],
  ['1.4.0', '30/09/2026', 'Indicateurs cliquables avec détail, noms des transporteurs, référentiel intégré.'],
  ['1.3.0', '30/09/2026', 'Intercos : envois et retours suivis séparément.'],
  ['1.2.0', '30/09/2026', 'Intercos aller-retour (Plateforme 38).'],
  ['1.1.0', '30/09/2026', 'Lecture du planning SST Monteux3 ; DESTO en sortie vers l’externe.'],
  ['1.0.0', '30/09/2026', 'Première version : préparation VL06O, affrètement, intercos, rapatriements, réceptions SST.'],
];

// ---------- Icônes ----------
const IC = {
  dash:'<path d="M3 13h8V3H3zM13 21h8v-8h-8zM3 21h8v-6H3zM13 3v8h8V3z"/>',
  prep:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  out:'<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  interco:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  rapat:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
  sst:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  paste:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
};
const icon = (k, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

// ---------- Utilitaires ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('fr-FR', {maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits:1, maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2});
const n0 = v => (v || v === 0) && isFinite(v) ? nf0.format(v) : '';
const n1 = v => isFinite(v) ? nf1.format(v) : '';
const hr = v => isFinite(v) ? nf2.format(v) + ' h' : '';
const pct = v => isFinite(v) ? Math.round(v * 100) + ' %' : '–';
const tons = kg => isFinite(kg) ? nf1.format(kg / 1000) : '';
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const num = v => {
  if (typeof v === 'number') return v;
  if (v == null || v === '') return 0;
  const x = parseFloat(String(v).replace(/[\s  ]/g, '').replace(',', '.'));
  return isFinite(x) ? x : 0;
};
const str = v => v == null ? '' : String(v).trim();
const uniq = a => [...new Set(a)];
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);

// Dates : toujours en chaîne ISO « AAAA-MM-JJ »
const pad = n => String(n).padStart(2, '0');
const isoUTC = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const utc = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (iso, n) => { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return isoUTC(d); };
function toIso(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; return isoUTC(new Date(Math.round((Math.floor(v) - 25569) * 864e5))); }
  if (v instanceof Date) return isNaN(v) ? null : isoLocal(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function isoWeek(iso) {
  const t = utc(iso); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(); const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return { y, w };
}
function mondayOf(y, w) {
  const s = new Date(Date.UTC(y, 0, 4)); const day = s.getUTCDay() || 7;
  s.setUTCDate(s.getUTCDate() - day + 1 + (w - 1) * 7); return isoUTC(s);
}
const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const dayIdx = iso => (utc(iso).getUTCDay() + 6) % 7;
const fdate = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const fdateL = iso => iso ? `${DAYS[dayIdx(iso)].slice(0, 3)}. ${fdate(iso)}` : '';
const today = () => isoLocal(new Date());

// ---------- Stockage (IndexedDB, repli mémoire) ----------
const DB = (() => {
  let dbp = null; const mem = {};
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const r = indexedDB.open('flux-hebdo', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  return {
    async get(k) {
      const db = await open(); if (!db) return mem[k];
      return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(mem[k]); } catch (e) { res(mem[k]); } });
    },
    async set(k, v) {
      mem[k] = v; const db = await open(); if (!db) return;
      return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } });
    },
  };
})();

// ---------- État ----------
const DEFAULT_SETTINGS = {
  cadSilo: 18, cadEntrepot: 400, cadExport: 750, cadMdd: 1300,
  equipes: [{ nom: 'Matin', debut: '05:00', fin: '12:30', prep: 2 }, { nom: 'Après-midi', debut: '12:30', fin: '20:00', prep: 2 }],
  joursTrav: [1, 1, 1, 1, 1, 0, 0],
  equipesSilo: [{ nom: 'Matin', debut: '05:00', fin: '12:30', prep: 1 }, { nom: 'Après-midi', debut: '12:30', fin: '20:00', prep: 1 }],
  capaInWeek: 2250, capaOutWeek: 3000,
  likpMarge: 30,       // préparation terminée X minutes avant l'heure de chargement LIKP
  likpSlot: 2,         // l'heure LIKP est le début d'un créneau de chargement de X heures (8h → 8h-10h)
  likpRef: 0,          // échéance calée sur 0 = début du créneau, 1 = fin du créneau
  prepDelai: 0,        // sans heure LIKP : 0 = le jour même avant l'heure par défaut, 1 = la veille au soir, 2 = fin du jour même
  likpDefaut: '12:00', // heure de chargement estimée quand la LIKP ne donne pas l'heure
  settingsV: 2,
  projAjust: true,     // ajuster la capacité restante au rendement réel mesuré   // capacité du quai en palettes par semaine
  intercoKeys: ['PLATEFORME 38', 'COMPANS', 'MCCORMICK'],
  // livraisons qui ne partent pas de Monteux3 (ex. COLRUYT, code dépôt 540 : départ direct de Compans)
  siteExt: 'Compans', depotsExt: ['540'], clientsExt: ['COLRUYT'],
  transporteurs: {},
  site: 'Monteux3',
};
const S = {
  settings: structuredClone(DEFAULT_SETTINGS),
  ref: null,            // référentiels importés (sinon REF_DEFAULT)
  prep: null,           // { file, importedAt, rows: [] }  – snapshot VL06O
  affret: { rows: {} }, // livraison -> ligne base affrètement
  rapat: { loads: {} }, // id -> chargement rapatriement
  prepHist: null,       // photos successives de la VL06O (rendement réel)
  likp: null,           // heures de chargement par livraison (table LIKP)
  sst: { rows: [] },
  ui: { tab: 'dash', week: null, prepView: 'plan', pf: {}, af: {}, rf: {}, sort: {} },
};
const save = k => DB.set(k, S[k]);
const ref = () => S.ref || window.REF_DEFAULT || { articles: {}, mlgt: {}, magasins: {} };
// Codes article comparés sans les zéros de tête (SAP exporte parfois 000000000000278710)
const artNorm = a => { a = String(a ?? '').trim(); return /^\d+$/.test(a) ? a.replace(/^0+(?=\d)/, '') : a.toUpperCase(); };
const normMaps = new WeakMap();
function normMap(obj) {
  if (!obj) return new Map();
  if (!normMaps.has(obj)) { const m = new Map(); for (const [k, v] of Object.entries(obj)) { const n = artNorm(k); if (!m.has(n)) m.set(n, v); } normMaps.set(obj, m); }
  return normMaps.get(obj);
}

// ---------- Moteur préparation (reprend la requête Power Query + formules Excel) ----------
const CIRCUITS = { 1: 'Entrepot', 2: 'GMS', 3: 'Export', 4: 'Allotie', 6: 'MDD', 9: 'Interco' };
function cadencePick(circuit) {
  const st = S.settings;
  if (circuit === 'Export') return st.cadExport;
  if (circuit === 'MDD') return st.cadMdd;
  return st.cadEntrepot;
}
let prepCache = null, prepCacheKey = '';
function prepLines() {
  if (!S.prep) return [];
  const st = S.settings, R = ref();
  const key = S.prep.importedAt + '|' + st.cadSilo + '|' + st.cadEntrepot + '|' + st.cadExport + '|' + st.cadMdd + '|' + (S.ref ? S.ref.date : 'def');
  if (prepCache && key === prepCacheKey) return prepCache;
  const AM = normMap(R.articles), MM = normMap(R.mlgt);
  const out = S.prep.rows.map(r => {
    const a = AM.get(artNorm(r.art));
    const uqpal = a ? num(a[3]) : 0;
    const circuit = CIRCUITS[r.prio] || '???';
    let palSilo = 0, colisSilo = 0, colisPick = 0, noRef = false;
    if (uqpal > 0) {
      palSilo = Math.floor(r.pk / uqpal);          // Number.RoundDown(Number of Packages / UQ/PAL)
      colisSilo = palSilo * uqpal;
      colisPick = r.pk - colisSilo;
    } else noRef = true;                           // PQ : valeur nulle -> non comptée
    return Object.assign({}, r, {
      circuit, uqpal, palSilo, colisSilo, colisPick, noRef,
      marque: a ? a[4] : '', format: (a && a[5]) || 'Standard', tyar: a ? a[0] : '',
      lieu: R.magasins[r.mag] || (r.mag ? 'Mag. ' + r.mag : ''),
      nbPick: colisPick > 0 ? 1 : 0,
      hrPick: colisPick / cadencePick(circuit),
      hrSilo: palSilo / st.cadSilo,
      picking: colisPick > 0 ? (MM.get(artNorm(r.art)) || '') : '',
    });
  });
  out.sort((a, b) => (a.dc || '').localeCompare(b.dc || '') || a.liv.localeCompare(b.liv) || a.poste - b.poste);
  prepCache = out; prepCacheKey = key;
  return out;
}
// Capacité de picking : préparateurs × durée de chaque équipe (ex. 2 × 7,5 h + 2 × 7,5 h = 30 h/jour)
const hm = t => { const m = String(t || '').match(/(\d{1,2})\s*[:h]\s*(\d{0,2})/); return m ? +m[1] + (+m[2] || 0) / 60 : 0; };
const teamDur = e => { let d = hm(e.fin) - hm(e.debut); if (d < 0) d += 24; return d; };
const teams = (key = 'equipes') => (S.settings[key] || []).filter(e => num(e.prep) > 0 && teamDur(e) > 0);
const capaDay = () => sum(teams(), e => num(e.prep) * teamDur(e));          // heures de picking disponibles par jour travaillé
const nbPrep = () => sum(teams(), e => num(e.prep));                          // préparateurs sur la journée
const hPerPrep = () => nbPrep() ? capaDay() / nbPrep() : 7.5;                 // durée moyenne d'un poste
const workDay = iso => !!(S.settings.joursTrav || [1, 1, 1, 1, 1, 0, 0])[dayIdx(iso)];
const capaOf = iso => workDay(iso) ? capaDay() : 0;
// Capacité quai (palettes) : hebdo répartie sur les jours travaillés
const nbWorkDays = () => Math.max(1, (S.settings.joursTrav || [1, 1, 1, 1, 1, 0, 0]).filter(Boolean).length);
const capaInDay = iso => workDay(iso) ? num(S.settings.capaInWeek) / nbWorkDays() : 0;
const capaOutDay = iso => workDay(iso) ? num(S.settings.capaOutWeek) / nbWorkDays() : 0;
const tauxBadge = v => isFinite(v) ? `<span class="badge b-nodot ${v > 1 ? 'b-crit' : v > .85 ? 'b-warn' : 'b-good'}">${pct(v)}</span>` : '–';
const teamsLbl = () => teams().map(e => `${e.prep} ${e.prep > 1 ? 'préparateurs' : 'préparateur'} ${e.debut}–${e.fin}`).join(' + ');
// Capacité SILO (caristes), séparée du picking
const capaSiloDay = () => sum(teams('equipesSilo'), e => num(e.prep) * teamDur(e));   // heures SILO disponibles / jour
const nbCar = () => sum(teams('equipesSilo'), e => num(e.prep));
const capaSiloOf = iso => workDay(iso) ? capaSiloDay() : 0;
const siloLbl = () => teams('equipesSilo').map(e => `${e.prep} cariste${e.prep > 1 ? 's' : ''} ${e.debut}–${e.fin}`).join(' + ');
function agg(lines) {
  return {
    liv: new Set(lines.map(l => l.liv)).size,
    codes: lines.length,
    palSilo: sum(lines, l => l.palSilo), hrSilo: sum(lines, l => l.hrSilo),
    nbPick: sum(lines, l => l.nbPick), colisPick: sum(lines, l => l.colisPick), hrPick: sum(lines, l => l.hrPick),
    total: sum(lines, l => l.pk),
  };
}
// Statut d'une livraison à partir des postes
function livStatus(lines) {
  const s = uniq(lines.map(l => l.sgp || 'A'));
  const prep = s.length === 1 && s[0] === 'C' ? 'C' : (s.every(x => x === 'A') ? 'A' : 'B');
  const w = uniq(lines.map(l => l.swm || 'A'));
  const ot = w.length === 1 && w[0] === 'C' ? 'C' : (w.every(x => x === 'A') ? 'A' : 'B');
  return { prep, ot };
}
let livIndexCache = null, livIndexKey = '';
function livIndex() {
  const lines = prepLines();

  const m = new Map();
  for (const l of lines) { if (!m.has(l.liv)) m.set(l.liv, []); m.get(l.liv).push(l); }
  const idx = new Map();
  for (const [liv, ls] of m) idx.set(liv, Object.assign(agg(ls), { nbLiv: 1, liv, lines: ls, dc: ls[0].dc, nom: ls[0].nom, ville: ls[0].ville, circuit: ls[0].circuit, prio: ls[0].prio, itin: ls[0].itin }, livStatus(ls)));

}

function readWorkbook(file) {

    if (!window.XLSX) return rej(new Error('Bibliothèque Excel (SheetJS) non chargée — le fichier lib/xlsx.full.min.js doit accompagner index.html.'));
    const fr = new FileReader();

    fr.onerror = () => rej(fr.error);

  const H = header.map(norm); const map = {};
  for (const [key, cands] of Object.entries(spec)) {
    for (const c of cands) { const i = H.indexOf(norm(c)); if (i >= 0) { map[key] = i; break; } }
    if (map[key] == null) for (const c of cands) { const n = norm(c); const i = H.findIndex(h => h && h.startsWith(n)); if (i >= 0) { map[key] = i; break; } }

}

function parseAffret(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());

  let M;

    h = -1; M = Math.max(...cells.map(r => r.length)) >= 20 ? AF_ORDER_NEW : AF_ORDER_OLD;

  const out = [];

// Rapatriements (classeur par entrepôt externe et par semaine : 2026_S40_FM.xlsx)
const DAY_RE = /^(LUNDI|MARDI|MERCREDI|JEUDI|VENDREDI|SAMEDI|DIMANCHE)/i;

function parseRapatWorkbook(wb, fileName) {

    const rows = sheetRows(wb.Sheets[name]);

    if (hi < 0) continue;

      const g = k => M[k] == null ? null : r[M[k]];
      const art = str(g('art')), des = str(g('des'));

      lines.push({ art, des, sscc: str(g('sscc')), qte: num(g('qte')), pal: M.pal != null ? num(g('pal')) : 1, poids: num(g('poids')), lot: str(g('lot')), date: toIso(g('date')), dlc: toIso(g('dlc')) });
    }
    if (!lines.length) continue;
    const first = rows.slice(hi + 1).find(r => M.remorque != null && r[M.remorque] != null);
    const g0 = k => first && M[k] != null ? str(first[M[k]]) : '';

    if (!date && monday) { date = addDays(monday, day ?? 0); approx = day == null; }
    const kind = isNav ? 'NAV' : (/^DESTO/i.test(name) || M.dt == null ? 'DESTO' : 'DT');
    const dtNo = M.dt != null ? str(rows[hi + 1][M.dt]) : '';

      ref: dtNo || name, remorque: g0('remorque'), usine: g0('usine'), livE: g0('livE'), livS: g0('livS'),

      lines: lines.map(({ date, ...l }) => l),

  quai: ['Quai', 'Porte'], comm: ['Commentaire', 'Commentaires', 'Observations', 'Remarque'], statut: ['Statut', 'Etat', 'Réceptionné'],

function timeStr(v) {
  if (typeof v === 'number' && v >= 0 && v < 1) { const mn = Math.round(v * 1440); return `${pad(Math.floor(mn / 60))}:${pad(mn % 60)}`; }

  return m ? `${pad(+m[1])}:${m[2] || '00'}` : '';
}
function parseSST(wb, fileName) {
  const out = [];
  for (const name of wb.SheetNames) {
    if (/cumul|ne pas toucher|synth|tcd/i.test(name)) continue;   // tableaux croisés et onglet technique
    const rows = sheetRows(wb.Sheets[name]);
    const hi = rows.slice(0, 25).findIndex(r => r.some(c => /date|jour/i.test(String(c ?? ''))) && r.filter(c => c != null && c !== '').length >= 3);
    if (hi < 0) continue;
    const M = headerMap(rows[hi], SST_SPEC);
    if (M.date == null || (M.sst == null && M.pal == null)) continue;
    let lastDate = null;
    for (const r of rows.slice(hi + 1)) {
      const g = k => M[k] == null ? null : r[M[k]];
      const d0 = toIso(g('date')); const d = d0 || lastDate; if (d0) lastDate = d0;
      const sst = str(g('sst')).replace(/\s+/g, ' '), refv = str(g('ref')), pal = num(g('pal'));

      const heure = timeStr(g('heure')), arr = timeStr(g('arr')), dep = timeStr(g('dep'));
      const stv = str(g('statut'));
      out.push({
        id: `${d}|${heure}|${sst.toUpperCase()}|${refv}`, date: d, heure, sst, ref: refv, pal, cam: M.cam != null ? num(g('cam')) : (pal ? 1 : 0),

        recu: !!arr || /^(oui|ok|x|re[cç]u|r[ée]ceptionn[ée]|fait|1|true)$/i.test(stv), src: fileName + ' / ' + name,
      });

// Référentiels : FichierArticle.XLSX, MLGT.XLSX, ou le classeur Analyse_Activité_Préparation lui-même
function parseRefs(wb) {
  const res = {};
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]); if (!rows.length) continue;
    const H = rows[0].map(norm);
    if (H.includes('article') && H.includes('uqa') && (H.includes('numer') || H.includes('uqpal'))) {
      const M = headerMap(rows[0], { art: ['Article'], tyar: ['TyAr'], uqa: ['UQA'], uq: ['UQ'], n: ['Numér.', 'UQ/PAL'], g4: ["Groupe d'articles 4"], g5: ["Groupe d'articles 5"] });
      const arts = {};
      for (const r of rows.slice(1)) {
        const a = typeof r[M.art] === 'number' ? String(r[M.art]) : str(r[M.art]); if (!a || arts[a]) continue;
        const tyar = str(r[M.tyar]), uqa = str(r[M.uqa]);
        if (uqa !== 'PAL' || tyar === 'ROH' || tyar === 'ZNVM') continue;   // filtre PQ Fichier_Article
        arts[a] = [tyar, uqa, str(r[M.uq]), num(r[M.n]) || null, M.g4 != null ? str(r[M.g4]) : '', M.g5 != null ? str(r[M.g5]) : ''];
      }

    } else if (H.includes('matnr') && H.includes('lgpla')) {
      const iA = H.indexOf('matnr'), iP = H.indexOf('lgpla'); const ml = {};

// ---------- Graphiques SVG (barres groupées / empilées) ----------
// series: [{key,label,color}], cats: [{label,sub}], data[catIdx][key]
function barChart({ cats, series, data, stacked = false, unit = '', fmt = n0, height = 240, ref = null, marks = null }) {
  const refs = (ref ? [].concat(ref) : []).filter(r => r && r.value > 0);

  const step = niceStep(max / 4); max = Math.ceil(max / step) * step;

  const bw = iw / cats.length;
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line class="gridline" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-t" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  let bars = '', hits = '';
  cats.forEach((c, i) => {
    const x0 = ml + i * bw;
    g += `<text class="axis-t" x="${x0 + bw / 2}" y="${H - mb + 16}" text-anchor="middle">${esc(c.label)}</text>`;
    if (c.sub) g += `<text class="axis-t" x="${x0 + bw / 2}" y="${H - mb + 30}" text-anchor="middle" opacity=".8">${esc(c.sub)}</text>`;
    const d = data[i];
    if (stacked) {
      const w = Math.min(46, bw * .5); let acc = 0; const xs = x0 + (bw - w) / 2;
      series.forEach((s, si) => {
        const v = d[s.key] || 0; if (v <= 0) return;
        const y1 = y(acc + v), y0 = y(acc); const hgt = Math.max(0, y0 - y1 - (acc > 0 ? 2 : 0));
        const top = si === series.length - 1 || series.slice(si + 1).every(t => !(d[t.key] > 0));
        bars += roundedBar(xs, y1, w, hgt, top ? 4 : 0, s.color);
        acc += v;
      });
      if (acc > 0) bars += `<text class="val-t" x="${xs + w / 2}" y="${y(acc) - 5}" text-anchor="middle">${fmt(acc)}</text>`;
    } else {
      const n = series.length, gap = 2, w = Math.min(30, (bw * .7 - gap * (n - 1)) / n);
      const xs = x0 + (bw - (w * n + gap * (n - 1))) / 2;
      series.forEach((s, si) => {
        const v = d[s.key] || 0; const x = xs + si * (w + gap);
        if (v > 0) { bars += roundedBar(x, y(v), w, y(0) - y(v), 4, s.color); bars += `<text class="val-t" x="${x + w / 2}" y="${y(v) - 5}" text-anchor="middle">${fmt(v)}</text>`; }
      });
    }

function buildAlerts(aff, prep) {
  const idx = livIndex(); const out = [];
  const t = today(), tomorrow = addDays(t, dayIdx(t) === 4 ? 3 : 1);
  if (S.prep) {
    const late = aff.filter(r => r.date <= tomorrow && idx.has(r.liv) && idx.get(r.liv).prep !== 'C');
    if (late.length) out.push(['crit', `<b>${late.length} livraison(s) à enlever d’ici ${fdateL(tomorrow)} non terminées en préparation</b><div class="x">${late.slice(0, 12).map(r => `${r.liv} ${esc(r.nom)} (${PREP_LABEL[idx.get(r.liv).prep][0]})`).join(' · ')}${late.length > 12 ? ' …' : ''}</div>`]);
    const missing = aff.filter(r => !idx.has(r.liv));
    if (missing.length) out.push(['info', `<b>${missing.length} livraison(s) affrétée(s) absentes de la VL06O : considérées comme expédiées</b><div class="x">${missing.slice(0, 12).map(r => r.liv).join(' · ')}${missing.length > 12 ? ' …' : ''}</div>`]);
    const noRef = prep.filter(l => l.noRef);
    if (noRef.length) out.push(['warn', `<b>${noRef.length} ligne(s) VL06O sans fiche article (UQ/PAL)</b><div class="x">Non comptées en SILO/picking, comme dans le fichier Excel. Articles : ${uniq(noRef.map(l => l.art)).slice(0, 15).join(', ')}</div>`]);
    const affLivs = new Set(Object.keys(S.affret.rows));
    const notPlanned = [...idx.values()].filter(l => inWeek(l.dc) && !affLivs.has(l.liv) && Object.keys(S.affret.rows).length);
    if (notPlanned.length) out.push(['info', `<b>${notPlanned.length} livraison(s) VL06O pas encore dans la base affrètement</b><div class="x">${notPlanned.slice(0, 12).map(l => `${l.liv} ${esc(l.nom)}`).join(' · ')}${notPlanned.length > 12 ? ' …' : ''}</div>`]);
  } else out.push(['info', '<b>VL06O non importée</b><div class="x">Importez l’extraction dans l’onglet Préparation pour activer les contrôles.</div>']);
  const approx = Object.values(S.rapat.loads).filter(l => l.approx && inWeek(l.date));
  if (approx.length) out.push(['info', `<b>${approx.length} chargement(s) de rapatriement sans jour identifié</b><div class="x">Placés au lundi : ${approx.map(l => esc(l.entrepot + ' / ' + l.sheet)).join(' · ')}</div>`]);
  return out.map(([c, h]) => `<div class="alert ${c}">${icon(c === 'info' ? 'info' : 'warn')}<div>${h}</div></div>`).join('');
}

function intercoRows() {

  for (const r of Object.values(S.affret.rows)) if (isInterco(r.nom, idx.get(r.liv)?.prio)) { const e = map.get(r.liv) || { liv: r.liv, nom: r.nom, ville: r.ville, v: idx.get(r.liv) }; e.a = r; e.date = r.date; map.set(r.liv, e); }
  const rows = [...map.values()].filter(e => inWeek(e.date)).map(e => ({
    date: e.date, liv: e.liv, nom: e.nom, ville: e.ville, dest: destGroup(e.nom),
    pal: e.a ? e.a.pal : null, palSilo: e.v ? e.v.palSilo : null, colis: e.v ? e.v.total : null, colisPick: e.v ? e.v.colisPick : null,

}

    : '<div class="empty"><b>Aucun interco cette semaine</b>Importez la VL06O, la base affrètement ou le planning SST.</div>'}
  </section>`;

function destGroup(nom) {
  const u = compact(nom);
  const k = S.settings.intercoKeys.find(k => k && u.includes(compact(k)));
  if (!k) return nom || '—';
  if (/MCCORMICK/.test(k.toUpperCase())) return nom; // plusieurs sites McCormick : garder le nom complet
  return k.charAt(0) + k.slice(1).toLowerCase();
}

      ${ents.map(e => { const x = lin.filter(l => l.entrepot === e); return `<div class="kpi" data-detail="ent|${esc(e)}" role="button" tabindex="0"><div class="lab">${esc(e)}</div><div class="val">${n0(sum(x, l => l.pal))}<small>pal</small></div><div class="det">${x.length} camion(s) entrant(s)</div></div>`; }).join('')}
    </div>
    <h2>Par entrepôt et par jour</h2><p class="hint">Palettes = colonne « Pal » / « Nb Pal » si présente, sinon une ligne = une unité de stock = une palette.</p>${mtx}
  </section>
  <section class="card glass"><div class="card-head"><div><h2>Camions</h2><p class="hint">Cliquez une ligne pour le détail des palettes. Les rapatriements (DT) sont des entrées au dépôt ; les déstockages (DESTO) et navettes détournées (NAV) sont des sorties vers l’entrepôt externe.</p></div>

}

function viewSST() {
  const { days } = weekData();
  const rows = S.sst.rows.filter(r => inWeek(r.date)).sort((a, b) => a.date.localeCompare(b.date) || a.heure.localeCompare(b.heure));
  const dshow = days.filter((d, i) => i < 5 || rows.some(r => r.date === d));
  const t = today(), nowH = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  const state = r => r.recu ? 'ok' : (r.date < t || (r.date === t && r.heure && r.heure < nowH) ? 'late' : 'plan');
  const stBadge = r => ({ ok: badge('Réceptionné', 'b-good'), late: badge('Non pointé', 'b-warn'), plan: badge('Planifié', 'b-neutral') })[state(r)];
  const cols = [
    { k: 'date', label: 'Date', fmt: fdateL }, { k: 'heure', label: 'Créneau' },
    { k: 'sst', label: 'Sous-traitant', html: r => `${esc(r.sst || '—')}${isInterco(r.sst) ? ' <span class="badge b-info b-nodot">Interco</span>' : ''}` },
    { k: 'pal', label: 'Palettes', num: true, fmt: n0 }, { k: 'cam', label: 'Camions', num: true, fmt: n0 },
    { k: 'arr', label: 'Arrivée' }, { k: 'dep', label: 'Départ' }, { k: 'comm', label: 'Commentaire', cls: 'wrap muted' },
    { k: 'etat', label: 'État', sv: r => state(r), html: stBadge },
    { k: 'recu', label: 'Pointage', html: r => `<button class="chip ${r.recu ? 'on' : ''}" data-recu="${esc(r.id)}">${r.recu ? '✓ Reçu' : 'Pointer'}</button>` },
    { k: 'x', label: '', html: r => r.src === 'saisie' ? `<button class="iconbtn" data-delsst="${esc(r.id)}" aria-label="Supprimer">${icon('trash')}</button>` : '' },
  ];
  const ssts = uniq(rows.map(r => r.sst)).sort((a, b) => sum(rows.filter(r => r.sst === b), r => r.pal) - sum(rows.filter(r => r.sst === a), r => r.pal));
  // grille des créneaux : lignes = heures, colonnes = jours
  const hours = uniq([...rows.map(r => r.heure).filter(Boolean)]).sort();
  const slots = hours.length ? (() => { const h0 = Math.min(6, ...hours.map(h => +h.slice(0, 2))), h1 = Math.max(18, ...hours.map(h => +h.slice(0, 2))); const out = []; for (let h = h0; h <= h1; h++) out.push(pad(h)); return out; })() : [];
  const grid = slots.length ? `<div class="tbl-wrap matrix" style="margin-bottom:16px;max-height:none"><table class="t slots"><thead><tr><th>Créneau</th>${dshow.map(d => `<th class="dayhead">${DAYS[dayIdx(d)]}<small>${fdate(d)} · ${n0(sum(rows.filter(r => r.date === d), r => r.pal))} pal</small></th>`).join('')}</tr></thead><tbody>
      ${slots.map(h => `<tr><td class="muted">${h}h</td>${dshow.map(d => { const x = rows.filter(r => r.date === d && r.heure.slice(0, 2) === h); return `<td>${x.map(r => `<span class="slot s-${state(r)}" data-tip="${esc(`<b>${esc(r.sst)}</b>${fdateL(r.date)} · ${r.heure}<br>${n0(r.pal)} palettes · ${n0(r.cam)} camion(s)`)}">${esc(r.heure)} · ${esc(r.sst || '—')} <b>${n0(r.pal)}</b></span>`).join('')}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>` : '';
  const files = uniq(S.sst.rows.filter(r => r.src !== 'saisie').map(r => r.src.split(' / ')[0]));
  return `<section class="card glass">
    <div class="card-head"><div><h2>Planning de réception sous-traitants</h2>
    <p class="hint">Déposez <kbd>Planning_Reception_SST_Monteux3.xlsb</kbd> : les onglets « PlanningReception AAAA » sont lus (créneaux avec RDV ou palettes). Le pointage « Reçu » est conservé lors des ré-imports.</p></div>
    ${files.length ? `<div class="meta" style="text-align:right">${files.map(esc).join('<br>')}<br>${n0(S.sst.rows.length)} RDV en mémoire</div>` : ''}</div>
    <div class="drop" data-drop="sst">${icon('upload')}<div><b>Déposez le planning ici</b> ou <button class="btn sm" data-pick="sst">choisir</button><small>Un fichier ré-importé remplace ses lignes précédentes.</small></div></div>
    <details class="paste" style="margin-top:14px"><summary>+ Ajouter un RDV manuellement</summary>
    <div class="form" style="margin-top:10px">
      <label>Date<input class="inp" type="date" id="sDate" value="${weekDays()[Math.min(4, dayIdx(today()))]}"></label>
      <label>Créneau<input class="inp" type="time" id="sHeure"></label>
      <label>Sous-traitant<input class="inp" id="sSst" list="sstList"><datalist id="sstList">${uniq(S.sst.rows.map(r => r.sst)).sort().map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
      <label>Palettes<input class="inp" type="number" min="0" id="sPal"></label>
      <label>Commentaire<input class="inp" id="sComm"></label>
      <button class="btn primary" data-act="sst-add">Ajouter</button>
    </div></details>
  </section>
  ${rows.length ? `<section class="card glass">
    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi" data-detail="sst" role="button" tabindex="0"><div class="lab"><i style="background:var(--in)"></i>Palettes attendues</div><div class="val">${n0(sum(rows, r => r.pal))}</div><div class="det">${n0(sum(rows, r => r.cam))} camion(s) · ${rows.length} RDV</div></div>
      <div class="kpi" data-detail="sst-pt" role="button" tabindex="0"><div class="lab">Réceptionnés</div><div class="val">${n0(rows.filter(r => r.recu).length)}<small>/ ${rows.length}</small></div><div class="bar"><span style="width:${Math.round(rows.filter(r => r.recu).length / rows.length * 100)}%"></span></div></div>
      ${ssts.slice(0, 3).map(sn => { const x = rows.filter(r => r.sst === sn); return `<div class="kpi" data-detail="sstn|${esc(sn)}" role="button" tabindex="0"><div class="lab">${esc(sn || '—')}</div><div class="val">${n0(sum(x, r => r.pal))}<small>pal</small></div><div class="det">${x.length} RDV</div></div>`; }).join('')}
    </div>
    <h2>Créneaux de la semaine</h2><p class="hint">Gris = planifié · orange = créneau passé non pointé · vert = réceptionné.</p>
    ${grid}
    <h2>Par sous-traitant</h2>
    <div class="tbl-wrap matrix" style="margin:10px 0 16px"><table class="t"><thead><tr><th>Sous-traitant</th>${dshow.map(d => `<th class="num dayhead">${DAYS[dayIdx(d)]}<small>${fdate(d)}</small></th>`).join('')}<th class="num">Semaine</th></tr></thead><tbody>
      ${ssts.map(sn => { const rs = rows.filter(r => r.sst === sn); return `<tr><td>${esc(sn || '—')}</td>${dshow.map(d => { const x = rs.filter(r => r.date === d); return `<td class="num">${x.length ? `<b>${n0(sum(x, r => r.pal))}</b> <span class="muted">pal · ${n0(sum(x, r => r.cam))} cam.</span>` : '<span class="muted">·</span>'}</td>`; }).join('')}<td class="num"><b>${n0(sum(rs, r => r.pal))}</b> <span class="muted">pal · ${n0(sum(rs, r => r.cam))} cam.</span></td></tr>`; }).join('')}
      <tr class="tot"><td>Total</td>${dshow.map(d => { const x = rows.filter(r => r.date === d); return `<td class="num">${x.length ? `${n0(sum(x, r => r.pal))} pal · ${n0(sum(x, r => r.cam))} cam.` : '·'}</td>`; }).join('')}<td class="num">${n0(sum(rows, r => r.pal))} pal · ${n0(sum(rows, r => r.cam))} cam.</td></tr>
    </tbody></table></div>
    <h2>Détail des RDV</h2>
    ${table('sst', cols, rows, { total: { pal: sum(rows, r => r.pal), cam: sum(rows, r => r.cam) } })}
  </section>` : `<section class="card glass"><div class="empty"><b>Aucune réception planifiée cette semaine</b>${S.sst.rows.length ? 'Le planning contient ' + n0(S.sst.rows.length) + ' RDV sur d’autres semaines.' : ''}</div></section>`}`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-recu]'); if (a) { const r = S.sst.rows.find(x => x.id === a.dataset.recu); if (r) { r.recu = !r.recu; save('sst'); render(); } return; }

      if (!n) throw new Error('Aucune livraison reconnue dans le fichier LIKP (VBELN / Livraison + date de chargement attendus).');
      S.likp = { importedAt: Date.now(), map: Object.assign({}, S.likp ? S.likp.map : {}, map) }; await save('likp');
      toast(`<b>${n} heures de chargement importées</b>`);

        for (const [k, l] of Object.entries(S.rapat.loads)) if (l.file === f.name) delete S.rapat.loads[k];

function prepPlanning(lines) {

    return Object.assign({}, a, { liv: l0.liv, nom: l0.nom, ville: l0.ville, circuit: l0.circuit, itin: l0.itin, D: dayOf(l0), t: slotOf(l0), it, st,
      rS: sum(open, l => l.hrSilo), rP: sum(open, l => l.hrPick), rPal: sum(open, l => l.palSilo), rColis: sum(open, l => l.colisPick), prep: livStatus(ls).prep, ot: livStatus(ls).ot });
  });
  if (!L.length) return none('Aucune livraison pour ces filtres.');
  const days = uniq(L.map(x => x.D)).filter(Boolean).sort();
  const ST = { ready: ['✓ Prête', 'b-good'], ok: ['✓ Passe', 'b-good'], late: ['✗ En retard', 'b-crit'], nc: ['—', 'b-neutral'] };
  const stBadge = x => {
    if (x.st === 'late') { const r = Math.max(x.it.retP || 0, x.it.retS || 0); return badge(`✗ Retard ${r ? hr(r) : ''}`.trim(), 'b-crit'); }
    return badge(...ST[x.st]);
  };
  const slotStatus = xs => {
    const late = xs.filter(x => x.st === 'late');
    if (late.length) return badge(`✗ ${late.length} en retard · jusqu’à ${hr(Math.max(...late.map(x => Math.max(x.it.retP || 0, x.it.retS || 0))))}`, 'b-crit');
    if (xs.every(x => x.st === 'ready')) return badge('✓ Tout est prêt', 'b-good');
    const m = Math.min(...xs.filter(x => x.it).map(x => Math.min(x.it.okP && x.it.rP ? x.it.capP - x.it.cumP : Infinity, x.it.okS && x.it.rS ? x.it.capS - x.it.cumS : Infinity)));
    return badge(`✓ Passe${isFinite(m) ? ` · marge ${n1(m)} h` : ''}`, 'b-good');
  };
  const open = S.ui.openSlot;
  const pr = (v, t) => t ? `<div class="bar" style="margin-top:4px;height:5px"><span style="width:${Math.round(v / t * 100)}%"></span></div>` : '';
  const dayCards = days.map(D => {
    const xs = L.filter(x => x.D === D), row = P ? P.rows.find(r => r.D === D) : null;
    const hrsT = sum(xs, x => x.hrSilo + x.hrPick), hrsR = sum(xs, x => x.rS + x.rP);
    const slots = uniq(xs.map(x => x.t)).sort((a, b) => (a === '') - (b === '') || a.localeCompare(b));

    const vd = (ok, m, lbl) => !row ? '' : `<div class="pv ${ok ? 'ok' : 'ko'}"><span>${lbl}</span><b>${ok ? '✓ passe' : '✗ ne passe pas'}</b><small>${ok ? `marge ${n1(m)} h` : `manque ${n1(-m)} h`}</small></div>`;

        <div class="plan-prog"><span>Avancement ${pct(hrsT ? 1 - hrsR / hrsT : NaN)}</span>${pr(hrsT - hrsR, hrsT)}<span class="meta">reste ${n1(hrsR)} h (SILO ${n1(sum(xs, x => x.rS))} h · picking ${n1(sum(xs, x => x.rP))} h)</span></div></div>
      <div class="pvs">${vd(row?.okP, row?.mP, 'Picking')}${vd(row?.okS, row?.mS, 'SILO')}${lateN ? `<div class="pv ko"><span>Livraisons</span><b>${lateN} en retard</b><small>sur ${xs.length}</small></div>` : `<div class="pv ok"><span>Livraisons</span><b>${xs.filter(x => x.st === 'ready').length} prêtes</b><small>sur ${xs.length}</small></div>`}</div>

      const sub = isOpen ? `<tr class="detail"><td colspan="9"><div style="padding:8px 10px">${table('plan' + key.replace(/\W/g, ''), [
        { k: 'liv', label: 'Livraison' }, { k: 'nom', label: 'Réceptionnaire', cls: 'wrap' }, { k: 'itin', label: 'Itinéraire' }, { k: 'circuit', label: 'Circuit' },
        { k: 'palSilo', label: 'Pal SILO', num: true, fmt: n0 }, { k: 'colisPick', label: 'Colis picking', num: true, fmt: n0 },
        { k: 'rS', label: 'Reste SILO', num: true, html: x => x.rS > 0 ? hr(x.rS) : '<span class="muted">—</span>' }, { k: 'rP', label: 'Reste picking', num: true, html: x => x.rP > 0 ? hr(x.rP) : '<span class="muted">—</span>' },
        { k: 'fin', label: 'Fin estimée', sv: x => Math.max(x.it?.finP || 0, x.it?.finS || 0), html: x => x.it && (x.it.finP || x.it.finS) ? esc(fdt(Math.max(x.it.finP || 0, x.it.finS || 0))) : '<span class="muted">—</span>' },

        <td class="num">${n0(sum(ss, x => x.colisPick))}${sum(ss, x => x.rColis) ? `<br><span class="muted">reste ${n0(sum(ss, x => x.rColis))}</span>` : ''}</td>

    }).join('');

      <div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>Créneau de chargement</th><th class="num">Livr. prêtes</th><th class="num">Pal SILO</th><th class="num">Colis picking</th><th class="num">Reste SILO</th><th class="num">Reste picking</th><th>Échéance prépa</th><th>Fin estimée</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  const info = P ? `<div class="alert info" style="margin-bottom:14px">${icon('info')}<div><b>Comment lire :</b> chaque jour de chargement est découpé par créneau LIKP (${num(S.settings.likpSlot)} h). « Reste » = postes pas encore au statut C, en heures (cadences). La fin estimée enchaîne le travail restant dans l’ordre des créneaux avec les équipes (${esc(teamsLbl())} ; SILO : ${esc(siloLbl())})${P.R.p ? `, au rendement réel mesuré (${pct(P.R.p)})` : ''}, à partir de la VL06O extraite le <b>${esc(fdt(P.at))}</b>. « En retard » = la fin estimée dépasse l’échéance (début du créneau − ${num(S.settings.likpMarge)} min ; sans heure LIKP, échéance estimée ${[`le jour même avant ${esc(S.settings.likpDefaut || '12:00')}`, 'la veille au soir', 'le jour même en fin de journée'][+S.settings.prepDelai || 0]}). Cliquez un créneau pour voir ses livraisons.${S.likp ? '' : ' <b>Collez la LIKP ci-dessus pour obtenir les créneaux.</b>'}</div></div>` : '';

}
document.addEventListener('click', e => { const r = e.target.closest('[data-openslot]'); if (!r || e.target.closest('th')) return; S.ui.openSlot = S.ui.openSlot === r.dataset.openslot ? null : r.dataset.openslot; render(); });

// ---------- Purge des données ----------
function purgeCounts(before) {
  const old = d => !before || (d && d < before);
  return {
    prep: S.prep ? S.prep.rows.length : 0,
    affret: Object.values(S.affret.rows).filter(r => old(r.date)).length,
    rapat: Object.values(S.rapat.loads).filter(l => old(l.date)).length,
    sst: S.sst.rows.filter(r => old(r.date)).length,
  };
}

      ${opt('affret', 'Base affrètement', all.affret, old.affret, 'livraisons collées')}
      ${opt('rapat', 'Rapatriements', all.rapat, old.rapat, 'camions des fichiers FM, Mutual, Tempo One…')}
      ${opt('sst', 'Réceptions sous-traitants', all.sst, old.sst, 'planning SST et pointages')}

      <label class="purge-opt"><input type="checkbox" data-purge="settings"><div><b>Paramètres</b><div class="det">cadences, équipes, transporteurs, intercos, départs hors site</div></div></label>

}
document.addEventListener('change', e => {
  if (e.target.name !== 'pscope') return;

  document.querySelectorAll('[data-pn]').forEach(n => { n.textContent = n0(+(old ? n.dataset.old : n.dataset.all)); });
  const pv = document.querySelector('[data-purge="prep"]'); if (pv && !pv.disabled) pv.checked = !old;   // la VL06O est une photo : ne pas la vider sans le vouloir

async function purgeRun() {
  const sel = k => document.querySelector(`[data-purge="${k}"]`)?.checked;
  const old = document.querySelector('input[name="pscope"]:checked')?.value === 'old';
  const before = old ? mondayOf(S.ui.week.y, S.ui.week.w) : null;
  const keep = d => before && d && d >= before;
  const keys = ['prep', 'affret', 'rapat', 'sst', 'ref', 'settings'].filter(sel);
  if (!keys.length) return toast('Rien de sélectionné.');
  const n = purgeCounts(before);
  const recap = keys.map(k => ({ prep: `VL06O (${n0(n.prep)} postes)`, affret: `affrètement (${n0(n.affret)})`, rapat: `rapatriements (${n0(n.rapat)})`, sst: `réceptions SST (${n0(n.sst)})`, ref: 'référentiel importé', settings: 'paramètres' })[k]).join(', ');
  if (!confirm(`Supprimer définitivement ${before ? 'avant le ' + fdate(before) + ' : ' : ''}${recap} ?`)) return;
  if (sel('prep')) { S.prep = null; S.prepHist = null; S.likp = null; await save('prepHist'); await save('likp'); }
  if (sel('affret')) { for (const [k, r] of Object.entries(S.affret.rows)) if (!keep(r.date)) delete S.affret.rows[k]; if (!before) S.affret = { rows: {} }; }
  if (sel('rapat')) for (const [k, l] of Object.entries(S.rapat.loads)) if (!keep(l.date)) delete S.rapat.loads[k];
  if (sel('sst')) S.sst.rows = S.sst.rows.filter(r => keep(r.date));
  if (sel('ref')) S.ref = null;
  if (sel('settings')) S.settings = structuredClone(DEFAULT_SETTINGS);
  S.ui.pf = {}; S.ui.af = {}; S.ui.rf = {}; S.ui.modal = null;
  await Promise.all(keys.map(k => save(k === 'settings' ? 'settings' : k)));

function renderModal() {

  const fn = DETAILS[key]; if (!fn) { S.ui.modal = null; return renderModal(); }

  const isNew = !m;
  if (isNew) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
  const sc = m.querySelector('.mbody')?.scrollTop || 0;
  m.innerHTML = `<div class="mback" data-close></div>

      <div class="mhead">${(S.ui.mstack || []).length ? `<button class="btn sm" data-mprev>← Retour</button>` : ''}<div style="flex:1;min-width:0"><h2 id="mTitle">${r.title}</h2><p class="hint" style="margin:2px 0 0">${r.sub || ''}</p></div>

      <div class="mbody">${r.body}</div>
    </div>`;
  m.querySelector('.mbody').scrollTop = sc;

  if (isNew) m.querySelector('.iconbtn[data-close]').focus();
}
